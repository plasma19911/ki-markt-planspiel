name: Verify Live Ticker Placement

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - '.github/workflows/verify-live-ticker-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for deployed HTML and verify exact order
        shell: bash
        env:
          LIVE_URL: https://ki-markt-planspiel.orkimperium.workers.dev/
        run: |
          set -u
          for i in $(seq 1 24); do
            echo "Live placement check $i/24"
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${LIVE_URL}?ticker_verify=${GITHUB_SHA}-${i}" -o /tmp/live.html; then
              if node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/live.html','utf8');
          const depot = html.indexOf('class="card allocation dashboardAllocation"');
          const ticker = html.indexOf('id="liveStockNews"');
          const marker = html.indexOf('data-placement="under-depot-v2"');
          const replay = html.indexOf('id="replayCard"');
          const ok = depot >= 0 && ticker > depot && marker >= ticker && replay > ticker;
          console.log(JSON.stringify({depot,ticker,marker,replay,ok}));
          process.exit(ok ? 0 : 1);
          NODE
              then
                echo 'LIVE VERIFIED: Kapitalverteilung -> Aktien-News -> Tages-Replay'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'LIVE NOT VERIFIED: gewünschte Reihenfolge ist auf dem Worker noch nicht ausgeliefert.' >&2
          exit 1
