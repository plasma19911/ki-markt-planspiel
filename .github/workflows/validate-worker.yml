name: Validate Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/smoke-fast-decisions.mjs"
      - "scripts/smoke-order-approval.mjs"
      - "scripts/calibrate_fast_signals.py"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/validate-worker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/constants.js
          node --check src/market.js
          node --check src/portfolio.js
          node --check src/market-v3.js
          node --check src/priority-equities.js
          node --check src/portfolio-v3.js
          node --check src/portfolio-prod.js
          node --check src/portfolio-final.js
          node --check src/portfolio-no-leverage.js
          node --check src/portfolio-learning.js
          node --check src/r2-portfolio.js
          node --check src/compact-portfolio.js
          node --check src/compact-portfolio-v2.js
          node --check src/compact-portfolio-v3.js
          node --check src/compact-portfolio-v4.js
          node --check src/compact-portfolio-v5.js
          node --check src/compact-portfolio-v6.js
          node --check src/order-approval.js
          node --check src/access-auth.js
          node --check src/fast-signals.js
          node --check src/gap-signals.js
          node --check src/volume-overlay.js
          node --check src/regional-benchmark-overlay.js
          node --check src/fx-safety-overlay.js
          node --check src/evidence-overlay.js
          node --check src/execution-cost-overlay.js
          node --check src/live-signal-learning.js
          node --check src/decision-guard.js
          node --check src/generated-fast-calibration.js
          node --check src/zero-broker.js
          node --check src/investment-intelligence.js
          node --check src/news-learning.js
          node --check src/news-learning-v2.js
          node --check src/macro-geopolitics.js
          node --check src/exposure-network.js
          node --check src/last-week.js
          node --check public/app.js
          node --check public/analysis-ui.js
          node --check public/investment-ui.js
          node --check public/news-learning-ui.js
          node --check public/macro-ui.js
          node --check public/exposure-ui.js
          node --check public/quota-guard.js
          node --check public/zero-ui.js
          node --check public/order-approval-ui.js
          node --check scripts/smoke-fast-decisions.mjs
          node --check scripts/smoke-order-approval.mjs
      - name: Python calibration syntax
        run: python3 -m py_compile scripts/calibrate_fast_signals.py
      - name: Fast decision smoke test
        run: node scripts/smoke-fast-decisions.mjs
      - name: Order approval smoke test
        run: node scripts/smoke-order-approval.mjs
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
