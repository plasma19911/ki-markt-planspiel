name: Deploy Cloudflare Worker (fast)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Install Wrangler only
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Test final decisions and restart isolation
        run: npm run test:decisions

      - name: Cloudflare dry run
        run: npm run check

      - name: Deploy Worker immediately
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify production really serves V26.3
        run: |
          node --input-type=module <<'NODE'
          const url='https://ki-markt-planspiel.orkimperium.workers.dev/api/status';
          let last='';
          for(let i=0;i<8;i++){
            try{
              const r=await fetch(`${url}?deploy_check=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
              const j=await r.json();
              last=`HTTP ${r.status}, finalDecisionPolicy.version=${j?.finalDecisionPolicy?.version ?? 'missing'}, automaticScaleUp=${j?.finalDecisionPolicy?.automaticScaleUp ?? 'missing'}, restartIsolation=${j?.runIsolationPolicy?.enabled ?? 'missing'}, timeBasedLossExit=${j?.finalDecisionPolicy?.timeBasedLossExit ?? 'missing'}`;
              if(r.ok&&j?.finalDecisionPolicy?.version===26.3&&j?.finalDecisionPolicy?.automaticScaleUp===false&&j?.runIsolationPolicy?.enabled===true&&j?.finalDecisionPolicy?.timeBasedLossExit===false){console.log(`Live verification OK: ${last}`);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          console.error(`Live verification failed: ${last}`);
          process.exit(1);
          NODE
