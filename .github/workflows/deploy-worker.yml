name: Deploy / Verify Cloudflare Worker V31.7+ Unified Learning

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'pc-agent/**'
      - 'tests/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/main-live-enforcer.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Critical production guards V31.7+
        run: |
          node --check src/index.js
          node --check src/index-v18.js
          node --check src/index-v20.js
          node --check src/status-lite.js
          node --check src/live-news-feed.js
          node --check src/position-chart-history.js
          node --check src/trade-republic-master.js
          node --check src/outcome-learning-core-v312.js
          node --check src/unified-decision-core-v310.js
          node --check src/decision-guard.js
          node --check src/execution-cost-overlay.js
          node --check src/compact-portfolio-v310-unified.js
          node --check src/compact-portfolio-v310-agent-recovery.js
          node --check src/compact-portfolio-v10.js
          node --check src/pc-agent-leader-blend-v3172.js
          node --check src/expectancy-core-v310.js
          node --check src/high-score-capital-deployment-v309.js
          node tests/v3172-agent-leader-blend.test.mjs
          node tests/v312-outcome-learning.test.mjs
          node tests/v310-unified-decision-core.test.mjs
          node tests/v310-expectancy.test.mjs
          node tests/status-lite-pc-agent.test.mjs
          node tests/v309-high-score-capital-deployment.test.mjs
          node tests/trade-republic-master.test.mjs
          node scripts/smoke-fast-decisions.mjs
          node scripts/smoke-best-validated-buy.mjs
          node scripts/smoke-target-venue-guard.mjs
          node scripts/smoke-zero-accounting.mjs
      - name: Cloudflare dry run
        run: npm run check
      - name: Detect Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy directly
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for Cloudflare Git integration
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify current unified production chain
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<42;i++){
            try{
              const q=Date.now();
              const [r,fr,ui]=await Promise.all([
                fetch(`${base}/api/status?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),
                fetch(`${base}/api/news-feed?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),
                fetch(`${base}/news-learning-ui.js?deploy=${q}`,{headers:{'cache-control':'no-cache'}})
              ]);
              const s=await r.json(),u=s?.unifiedDecisionCorePolicy||{},learn=s?.outcomeLearningPolicy||s?.predictiveLearningPolicy||{},e=s?.expectancyCorePolicy||{},a=s?.architecture||{},ex=s?.executionModel||{},m=s?.manualTradePolicy||{},bm=m?.brokerMaster||{},ubm=u?.brokerMaster||{},capital=u?.capital||{};
              let feed={};try{feed=await fr.json()}catch{}
              const feedOk=fr.ok&&feed?.ok===true&&Number(feed?.refreshSeconds)===60&&Array.isArray(feed?.items)&&ui.ok;
              const positions=Array.isArray(s?.positions)?s.positions:[],symbol=positions[0]?.symbol?String(positions[0].symbol):'';
              let chartOk=true,chartInfo='no-position';if(symbol){const cr=await fetch(`${base}/api/position-chart?symbol=${encodeURIComponent(symbol)}&range=1d&deploy=${Date.now()}`,{headers:{'cache-control':'no-cache'}});let cj={};try{cj=await cr.json()}catch{}chartOk=cr.ok&&cj?.ok===true&&Array.isArray(cj?.bars)&&cj.bars.length>0;chartInfo=`${symbol}:${cr.status}/${cj?.bars?.length||0}`}
              const runtime=Number(String(s?.runtimeVersion||'').replace(/^V/i,'')),live=Number(String(s?.liveDecisionVersion||'').replace(/^V/i,'')),outcomeVersion=Number(String(s?.outcomeLearningVersion||'').replace(/^V/i,''));
              const brokerOk=Number(bm?.rowCount)>0&&String(bm?.source||'').includes('env.ASSETS')&&Number(ubm?.rowCount)>0;
              const learningContract=outcomeVersion===31.2&&Number(learn?.version)===31.2&&learn?.insideUnifiedAuthority===true&&a?.persistentOutcomeLearning===true&&a?.outcomeLearningStorageKey==='outcome-learning-v312'&&a?.stateMergeUsesRawCandidates===true&&ex?.outcomeLearningV312===true&&ex?.continuousCandidateTracking===true&&Number.isFinite(Number(learn?.trackedSymbols));
              const currentUnified=Number.isFinite(runtime)&&runtime>=31.7&&runtime===live&&u?.enabled===true&&/candidate-state-recovery/i.test(String(u?.patch||''))&&Number(a?.outerDecisionLayers)===1&&a?.outerAuthority==='UnifiedDecisionCoreV310';
              const entryBridge=Number(capital?.canonicalProposalScore)===60&&Number(capital?.canonicalMinDataQuality)===55&&Number(capital?.canonicalMinOrthogonalConfirmations)===1;
              const ok=r.ok&&currentUnified&&learningContract&&entryBridge&&a?.persistentDecisionAudit===true&&ex?.unifiedDecisionCoreV310===true&&Number(e?.hardStopPct)===-1.2&&Number(e?.trailArmPct)===2.4&&brokerOk&&capital?.heldMasterEnrichment===true&&positions.length<=4&&chartOk&&feedOk;
              last=`HTTP ${r.status} runtime=${s?.runtimeVersion}/${s?.liveDecisionVersion} learning=${learn?.mode}/${learn?.matured} tracked=${learn?.trackedSymbols} candidates=${learn?.currentCandidates} bridge=${capital?.patch}/${capital?.canonicalProposalScore} patch=${u?.patch} news=${fr.status}/${feed?.items?.length||0} chart=${chartInfo}`;
              if(ok){console.log('Live V31.7+ unified verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Current unified chain not live: '+last);
          NODE
