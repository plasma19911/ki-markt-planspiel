name: Deploy / Verify Cloudflare Worker V29.8 TR audit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'pc-agent/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/main-live-enforcer.yml'
      - '.github/workflows/live-health.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Regression tests
        run: npm run test:decisions
      - name: Cloudflare dry run
        run: npm run check
      - name: Detect Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy directly
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for Cloudflare Git integration
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify Trade Republic V29.7 production
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<42;i++){
            try{
              const q=Date.now();
              const r=await fetch(`${base}/api/status?view=dashboard&deploy=${q}`,{headers:{'cache-control':'no-cache'}}),s=await r.json();
              const ui=await fetch(`${base}/v287-live-ui.js?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),uit=await ui.text();
              const one=await fetch(`${base}/onepager.html?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),onet=await one.text();
              const ch=await fetch(`${base}/changelog-v297.js?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),cht=await ch.text();
              const f=s?.finalDecisionPolicy||{},canon=s?.canonicalScorePolicy||{},profit=s?.profitExitPolicy||{},broker=s?.brokerTarget||{},session=s?.tradeRepublicSession||s?.gettexSession||{},pc=s?.pcFirstScannerPolicy||{};
              const headersOk=r.headers.get('x-broker-target')==='trade-republic-bestpreis'&&r.headers.get('x-entry-model')==='decision-score-56-immediate-buy';
              const runtimeOk=r.ok&&Number(f.version)>=29.7&&Number(canon.version)>=29.7&&Number(canon.immediateBuyMin)===56&&canon.adaptiveProfitExit===true&&Number(profit.version)>=29.7;
              const brokerOk=broker.name==='Trade Republic'&&broker.stocksOnly===true&&Number(broker.regularOrderFeeEur)===1&&String(broker.venue||'').includes('Bestpreis')&&String(session.broker||'Trade Republic')==='Trade Republic';
              const uiOk=ui.ok&&/version:29\.8/.test(uit)&&/brokerTarget:'Trade Republic'/.test(uit)&&/immediateBuyFrom56:true/.test(uit)&&/softGatesAbove56:false/.test(uit)&&!/gettex/i.test(uit);
              const oneOk=one.ok&&/Trade Republic · Bestpreis/.test(onet)&&/nur Aktien/.test(onet)&&!/finanzen\.net ZERO/i.test(onet)&&!/gettex/i.test(onet)&&!/UCITS/i.test(onet);
              const changelogOk=ch.ok&&/V29\.7/.test(cht)&&/SOFORT BUY ab DecisionScore 56/.test(cht);
              const pcOk=Number(pc.version)>=29.2;
              last=`HTTP ${r.status} final=${f.version} canon=${canon.version} profit=${profit.version} broker=${broker.name}/${broker.venue} pc=${pc.version} ui=${ui.status} one=${one.status} changelog=${ch.status}`;
              if(headersOk&&runtimeOk&&brokerOk&&uiOk&&oneOk&&changelogOk&&pcOk){console.log('Live verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Trade Republic V29.7/V29.8 audit not live: '+last);
          NODE
