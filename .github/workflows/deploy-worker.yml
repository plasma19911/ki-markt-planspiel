name: Deploy / Verify Cloudflare Worker V30.1

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'pc-agent/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/main-live-enforcer.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Regression tests
        run: npm run test:decisions
      - name: Cloudflare dry run
        run: npm run check
      - name: Detect Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy directly
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for Cloudflare Git integration
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify V30.1 production
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now();
              const sr=await fetch(`${base}/api/status?view=dashboard&deploy=${q}`,{headers:{'cache-control':'no-cache'}});const s=await sr.json();
              const ir=await fetch(`${base}/?deploy=${q}`,{headers:{'cache-control':'no-cache'}});const index=await ir.text();
              const mr=await fetch(`${base}/changelog-master-v290.js?deploy=${q}`,{headers:{'cache-control':'no-cache'}});const master=await mr.text();
              const cr=await fetch(`${base}/changelog-v301.js?deploy=${q}`,{headers:{'cache-control':'no-cache'}});const changelog=await cr.text();
              const final=s?.finalDecisionPolicy||{},entry=s?.daytradeEntryPolicy||{},dip=s?.daytradeDipPolicy||{},cap=s?.daytradeLargeCapPolicy||{};
              const runtimeOk=s?.runtimeVersion==='V30.1'&&s?.liveDecisionVersion==='V30.1';
              const finalOk=Number(final.version)>=30.1&&final.daytradeFreshTapeEntry===true&&final.quoteFreshnessScoreInput===true&&final.fastFieldCoverageScoreInput===true&&Number(final.maxOpenPositions)===4&&Number(final.targetCashDeploymentPct)===90;
              const entryOk=Number(entry.version)>=30.1&&entry.authoritativeDaytradeEntry===true&&Number(entry.immediateBuyMin)===56&&entry.quoteFreshnessInScore===true&&entry.fastFieldCoverageInScore===true&&entry.cleanRetestAware===true&&entry.cleanContinuationAware===true;
              const dipOk=Number(dip.version)>=30&&dip.authoritativeDaytradeEntry===true&&Number(dip.maxOpenPositions)===4&&Number(dip.targetCashDeploymentPct)===90;
              const capOk=Number(cap.version)>=29.9&&cap.largeCapsPreferred===true;
              const uiOk=ir.ok&&/changelog-v301\.js\?v=20260821-1205/.test(index)&&/changelog-master-v290\.js\?v=20260821-1205/.test(index);
              const changelogOk=mr.ok&&/changelogMaster='v30\.1'/.test(master)&&/version:30\.1/.test(master)&&cr.ok&&/__CHANGELOG_V301__/.test(changelog)&&/V30\.1 · Daytrading-Timing/.test(changelog);
              last=`HTTP ${sr.status} runtime=${s?.runtimeVersion} final=${final.version} entry=${entry.version} dip=${dip.version} cap=${cap.version} index=${ir.status}`;
              if(sr.ok&&runtimeOk&&finalOk&&entryOk&&dipOk&&capOk&&uiOk&&changelogOk){console.log('Live V30.1 verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('V30.1 not live: '+last);
          NODE
