name: Deploy / Verify Cloudflare Worker V29.0

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/main-live-enforcer.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Regression tests
        run: npm run test:decisions
      - name: Cloudflare dry run
        run: npm run check
      - name: Detect Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy directly
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for Cloudflare Git integration
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify V29.0 production
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now(),r=await fetch(`${base}/api/status?view=dashboard&deploy=${q}`,{headers:{'cache-control':'no-cache'}}),s=await r.json();
              const ui=await fetch(`${base}/v287-live-ui.js?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),txt=await ui.text();
              const e=s?.entryProfitPolicy||{},p=s?.dynamicProfitLockPolicy||{},f=s?.finalDecisionPolicy||{},pc=s?.pcFirstScannerPolicy||{};
              const ok=r.ok&&Number(f.version)>=29&&f.scoutEntryFrom60===true&&f.regularEntryFrom72===true&&f.dynamicProfitLockV290===true&&f.highScoreProfitExit===true&&Number(e?.thresholds?.entry?.scoutMin)===60&&Number(e?.thresholds?.entry?.regularMin)===72&&Number(p.version)>=29&&Number(pc.version)>=28.8&&ui.ok&&/version:29\.0/.test(txt)&&/stagedEntryFrom60:true/.test(txt)&&/dynamicProfitLock:true/.test(txt);
              last=`HTTP ${r.status} final=${f.version} entry=${e.version} profit=${p.version} pc=${pc.version} ui=${ui.status}`;
              if(ok){console.log('Live verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('V29.0 not live: '+last);
          NODE
