name: Deploy / Verify Cloudflare Worker V31.0 Unified

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'pc-agent/**'
      - 'tests/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/main-live-enforcer.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Critical production guards V31.0 Unified
        run: |
          node --check src/index.js
          node --check src/unified-decision-core-v310.js
          node --check src/compact-portfolio-v310-unified.js
          node --check src/expectancy-core-v310.js
          node --check src/high-score-capital-deployment-v309.js
          node --check src/manual-trade-v307.js
          node --check src/compact-portfolio-v307-manual-control.js
          node --check src/sell-rebuy-churn-v306.js
          node --check src/weakest-position-replacement-v3061.js
          node --check src/profit-opportunity-v305.js
          node --check src/relative-rotation-v304.js
          node --check src/held-cash-deployment-v304.js
          node --check public/manual-trade-ui.js
          node tests/v310-unified-decision-core.test.mjs
          node tests/v310-expectancy.test.mjs
          node tests/v309-high-score-capital-deployment.test.mjs
          node tests/v307-manual-trade.test.mjs
          node tests/v3061-weakest-position-replacement.test.mjs
          node tests/v306-sell-rebuy-churn.test.mjs
          node tests/v3053-profit-opportunity.test.mjs
          node tests/v304-relative-rotation-cash.test.mjs
          node scripts/smoke-target-venue-guard.mjs
          node scripts/smoke-zero-accounting.mjs
      - name: Cloudflare dry run
        run: npm run check
      - name: Detect Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy directly
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for Cloudflare Git integration
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify V31.0 unified production
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const r=await fetch(`${base}/api/status?deploy=${Date.now()}`,{headers:{'cache-control':'no-cache'}}),s=await r.json(),u=s?.unifiedDecisionCorePolicy||{},e=s?.expectancyCorePolicy||{},m=s?.manualTradePolicy||{},a=s?.architecture||{},ex=s?.executionModel||{};
              const ok=r.ok&&s?.runtimeVersion==='V31.0'&&s?.liveDecisionVersion==='V31.0'&&u.enabled===true&&u.patch==='31.0-unified-decision-authority'&&a.outerDecisionLayers===1&&a.persistentDecisionAudit===true&&Number(e.hardStopPct)===-1.2&&Number(e.trailArmPct)===2.4&&Number(e.minHoldMinutes)===12&&Number(e.reentryMinutes)===90&&Number(e.minPositionEur)===2200&&ex.unifiedDecisionCoreV310===true&&Number(m.maxAllocationPct)===100;
              last=`HTTP ${r.status} runtime=${s?.runtimeVersion} unified=${u.patch} layers=${a.outerDecisionLayers}`;
              if(ok){console.log('Live V31.0 unified verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('V31.0 unified not live: '+last);
          NODE
