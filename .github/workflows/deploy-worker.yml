name: Deploy / Verify Cloudflare Worker V30.5

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'pc-agent/**'
      - 'tests/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/main-live-enforcer.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Critical production guards V30.5
        run: |
          node --check src/profit-opportunity-v305.js
          node --check src/compact-portfolio-v305-profit-opportunity.js
          node --check src/relative-rotation-v304.js
          node --check src/held-cash-deployment-v304.js
          node tests/v305-profit-opportunity.test.mjs
          node tests/v304-relative-rotation-cash.test.mjs
          node scripts/smoke-target-venue-guard.mjs
          node scripts/smoke-zero-accounting.mjs
      - name: Cloudflare dry run
        run: npm run check
      - name: Detect Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy directly
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for Cloudflare Git integration
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify V30.5 production
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now(),r=await fetch(`${base}/api/status?deploy=${q}`,{headers:{'cache-control':'no-cache'}}),s=await r.json();
              const p=s?.profitOpportunityPolicy||{},rot=s?.relativeRotationPolicy||{},cash=s?.heldCashDeploymentPolicy||{},ex=s?.executionModel||{},final=s?.finalDecisionPolicy||{};
              const ok=r.ok&&s?.runtimeVersion==='V30.5'&&s?.liveDecisionVersion==='V30.5'&&Number(p.version)>=30.5&&p.hardSafetyNeverOverridden===true&&Number(p.starterMinScore)===66&&final.profitOpportunityController===true&&ex.profitOpportunityV305===true&&Number(rot.version)>=30.4&&Number(cash.targetDeploymentPct)===98;
              last=`HTTP ${r.status} runtime=${s?.runtimeVersion} profit=${p.version} starter=${p.starterMinScore}`;
              if(ok){console.log('Live V30.5 verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('V30.5 not live: '+last);
          NODE
