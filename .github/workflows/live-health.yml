name: Live Worker Health

on:
  push:
    branches: [main]
    paths-ignore:
      - live-health-result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe live Worker
        run: |
          set -euo pipefail
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          curl -fsS --retry 3 --retry-delay 2 -D /tmp/home.headers -o /tmp/home.html "$BASE/"
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/app.js "$BASE/app.js"
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/status.json "$BASE/api/status"
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/agent.json "$BASE/api/agent/status"
          grep -q 'KI Markt-Planspiel' /tmp/home.html
          grep -q 'async function load' /tmp/app.js

      - name: Build compact result
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          s=json.load(open('/tmp/status.json',encoding='utf-8'))
          a=json.load(open('/tmp/agent.json',encoding='utf-8'))
          c=s.get('config') or {}
          out={
            'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'homepageOk': 'KI Markt-Planspiel' in pathlib.Path('/tmp/home.html').read_text(encoding='utf-8',errors='replace'),
            'appJsOk': 'async function load' in pathlib.Path('/tmp/app.js').read_text(encoding='utf-8',errors='replace'),
            'apiStatusOk': bool(c),
            'running': c.get('running'),
            'scanCount': c.get('scan_count'),
            'lastScan': c.get('last_scan'),
            'universeCount': c.get('universe_count'),
            'positions': len(s.get('positions') or []),
            'candidates': len(s.get('candidates') or []),
            'pcAgent': {
              'configured': a.get('configured'),
              'online': a.get('online'),
              'lastSeenAt': a.get('lastSeenAt'),
              'ageSeconds': a.get('ageSeconds'),
              'prefetchFresh': a.get('prefetchFresh'),
              'prefetchAt': a.get('prefetchAt'),
              'resolvedLeaderCount': a.get('resolvedLeaderCount'),
              'leaderHealthy': a.get('leaderHealthy'),
              'futureCandidates': a.get('futureCandidates'),
              'metrics': a.get('metrics')
            }
          }
          pathlib.Path('live-health-result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if a.get('configured') is not True:
              raise SystemExit('PC_AGENT_TOKEN missing in runtime Worker')
          PY

      - name: Publish result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-health-result.json
          if git diff --cached --quiet; then
            echo 'Health result unchanged'
          else
            git commit -m 'Update live health result [skip ci]'
            git push
          fi
