name: Live Worker Health V31.7+ Unified Learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'live-health-result.json'
      - 'replay-depot-health-result.json'
      - 'validation-result.json'
      - 'recovery-20260819-result.json'

permissions:
  contents: write

concurrency:
  group: live-health-unified-learning
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Allow Cloudflare publish
        run: sleep 75
      - name: Probe current production chain
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://ki-markt-planspiel.orkimperium.workers.dev',q=Date.now();
          const get=async u=>{try{const r=await fetch(u,{headers:{'cache-control':'no-cache'}});return{status:r.status,ok:r.ok,text:await r.text()}}catch(e){return{status:0,ok:false,text:String(e)}}};
          const [home,status,agent,agmAsset,news]=await Promise.all([get(`${base}/?health=${q}`),get(`${base}/api/status?health=${q}`),get(`${base}/api/agent/status?health=${q}`),get(`${base}/agm-calendar.json?health=${q}`),get(`${base}/api/news-feed?health=${q}`)]);
          let s={},a={},agm={},nf={};try{s=JSON.parse(status.text)}catch{}try{a=JSON.parse(agent.text)}catch{}try{agm=JSON.parse(agmAsset.text)}catch{}try{nf=JSON.parse(news.text)}catch{}
          const positions=Array.isArray(s?.positions)?s.positions:[],c=s?.config||{},u=s?.unifiedDecisionCorePolicy||{},learn=s?.outcomeLearningPolicy||s?.predictiveLearningPolicy||{},e=s?.expectancyCorePolicy||{},arch=s?.architecture||{},m=s?.manualTradePolicy||{},ex=s?.executionModel||{},bm=m?.brokerMaster||{},ubm=u?.brokerMaster||{},capital=u?.capital||{},recovery=s?.pcAgentScanRecovery||{},candidates=Array.isArray(s?.candidates)?s.candidates:[];
          const candidateRows=candidates.slice(0,20).map(x=>({symbol:x?.symbol||null,name:x?.name||null,price:x?.price??null,last:x?.last??null,last_price:x?.last_price??null,lastPrice:x?.lastPrice??null,currentPrice:x?.currentPrice??null,regularMarketPrice:x?.regularMarketPrice??null,decisionScore:x?.decisionScore??null,daytradeLiveScore:x?.daytradeLiveScore??null,score:x?.score??null,confidence:x?.confidence??x?.liveConfidence??null,momentum5Pct:x?.momentum5Pct??x?.momentum5??null,momentum20Pct:x?.momentum20Pct??x?.momentum20??null,acceleration5Pct:x?.acceleration5Pct??x?.momentumAcceleration5??null,newsScore:x?.newsScore??x?.news_score??null,quoteAgeMinutes:x?.quoteAgeMinutes??null,brokerVerified:x?.brokerVerified??null,brokerMatchMode:x?.brokerMatchMode??null,brokerVerificationSource:x?.brokerVerificationSource??null,isin:x?.isin??null,assetClass:x?.assetClass??null,keys:Object.keys(x||{}).slice(0,80)}));
          let market=0;for(const x of positions){const inv=Number(x?.invested)||0,ep=Number(x?.entry_price)||0,lp=Number(x?.last_price)||ep,ef=Number(x?.entry_fx)||1,lf=Number(x?.last_fx)||ef;market+=ep>0&&ef>0?inv*(lp/ep)*(lf/ef):inv}const equity=Number(s?.equity)||0,cash=Number(c?.cash)||0,delta=equity-(cash+market);
          let chart={status:null,ok:true,symbol:null,bars:0};if(positions[0]?.symbol){chart.symbol=String(positions[0].symbol);const cr=await get(`${base}/api/position-chart?symbol=${encodeURIComponent(chart.symbol)}&range=1d&health=${q}`);chart.status=cr.status;let cj={};try{cj=JSON.parse(cr.text)}catch{}chart.bars=Array.isArray(cj?.bars)?cj.bars.length:0;chart.ok=cr.ok&&cj?.ok===true&&chart.bars>0}
          const agmEvents=Array.isArray(agm?.events)?agm.events:[],agmUpdated=Date.parse(String(agm?.updatedAt||'')),agmAge=Number.isFinite(agmUpdated)?(Date.now()-agmUpdated)/3600000:Infinity;
          const runtime=Number(String(s?.runtimeVersion||'').replace(/^V/i,'')),liveRuntime=Number(String(s?.liveDecisionVersion||'').replace(/^V/i,'')),outcomeRuntime=Number(String(s?.outcomeLearningVersion||'').replace(/^V/i,''));
          const unifiedPatch=String(u?.patch||''),candidateRecovery=/candidate-state-recovery/i.test(unifiedPatch);
          const checks={
            homepage:home.ok,apiStatus:status.ok,agentEndpoint:agent.ok,
            runtimeCurrent:Number.isFinite(runtime)&&runtime>=31.7&&runtime===liveRuntime&&outcomeRuntime===31.2,
            unifiedDecisionAuthority:u?.enabled===true&&Number(arch?.outerDecisionLayers)===1&&arch?.outerAuthority==='UnifiedDecisionCoreV310'&&candidateRecovery,
            outcomeLearningV312:Number(learn?.version)===31.2&&learn?.enabled===true&&learn?.insideUnifiedAuthority===true&&arch?.persistentOutcomeLearning===true&&arch?.outcomeLearningStorageKey==='outcome-learning-v312'&&arch?.stateMergeUsesRawCandidates===true,
            learningActuallyTracking:Number(learn?.trackedSymbols)>0,
            continuousFeedback:ex?.outcomeLearningV312===true&&ex?.continuousCandidateTracking===true&&ex?.learnsMissedOpportunities===true&&ex?.learnsBadBuys===true&&ex?.learnsEarlySells===true&&ex?.learnsSignalWeights===true&&ex?.recentOutcomesWeightedHigher===true,
            expectancy:Number(e?.hardStopPct)===-1.2&&Number(e?.trailArmPct)===2.4&&Number(e?.minHoldMinutes)===8&&Number(e?.reentryMinutes)===45&&Number(e?.stagnationReviewMinutes)===75&&Number(e?.maxStagnationMinutes)===180,
            brokerMaster:Number(bm?.rowCount)>0&&String(bm?.source||'').includes('env.ASSETS')&&Number(ubm?.rowCount)>0,
            capital:capital?.heldMasterEnrichment===true,
            newsFeed:news.ok&&nf?.ok===true&&Number(nf?.refreshSeconds)===60,
            agmCalendarFresh:agmAsset.ok&&agmEvents.length>0&&agmAge>=0&&agmAge<=26,
            positionChart:chart.ok,pcAgentRecovery:recovery.enabled===true,pcAgentFresh:a?.configured!==true||(a?.online===true&&Number(a?.ageSeconds)<=180),accountingConsistent:Math.abs(delta)<=0.05,lastErrorClear:!c?.last_error,positionCountWithinLimit:positions.length<=4
          };
          const out={checkedAt:new Date().toISOString(),runtimeVersion:s?.runtimeVersion,liveDecisionVersion:s?.liveDecisionVersion,outcomeLearningVersion:s?.outcomeLearningVersion,checks,failedChecks:Object.keys(checks).filter(k=>!checks[k]),allRequiredChecksPassed:Object.values(checks).every(Boolean),outcomeLearningPolicy:learn,paperExploration:u?.paperExploration||null,scanCount:c?.scan_count,lastScan:c?.last_scan,lastError:c?.last_error,aiLastSummary:c?.ai_last_summary,cash,equity,pnl:s?.pnl,marketValue:market,accountingDelta:delta,positions:positions.length,positionRows:positions.slice(0,10),candidateCount:candidates.length,candidateRows,pcAgent:a,positionChart:chart,agmCalendar:{updatedAt:agm?.updatedAt||null,ageHours:Number.isFinite(agmAge)?+agmAge.toFixed(2):null,events:agmEvents.length},newsFeed:{status:news.status,items:Array.isArray(nf?.items)?nf.items.length:0,refreshSeconds:nf?.refreshSeconds},architecture:arch,unifiedDecisionCorePolicy:u,executionModel:ex};
          fs.writeFileSync('/tmp/live-health-result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));if(out.failedChecks.length)process.exitCode=2;
          NODE
      - name: Publish diagnostic
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/live-health-result.json live-health-result.json
            git add live-health-result.json
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Update unified learning live health [skip ci]'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          if [ "$published" != "1" ]; then exit 1; fi
      - name: Enforce health
        run: |
          cp /tmp/live-health-result.json live-health-result.json
          node -e "const x=require('./live-health-result.json');if(x.failedChecks?.length){console.error(x.failedChecks);process.exit(1)}console.log('Worker healthy: unified authority live and outcome learning is tracking symbols.')"