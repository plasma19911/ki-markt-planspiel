name: Live Worker Health

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -D /tmp/home.headers -o /tmp/home.html https://ki-markt-planspiel.orkimperium.workers.dev/
          grep -q "KI Markt-Planspiel" /tmp/home.html
          echo "HOME_OK bytes=$(wc -c </tmp/home.html)"
      - name: Check app.js
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/app.js https://ki-markt-planspiel.orkimperium.workers.dev/app.js
          grep -q "async function load" /tmp/app.js
          echo "APP_JS_OK bytes=$(wc -c </tmp/app.js)"
      - name: Check API status
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/status.json https://ki-markt-planspiel.orkimperium.workers.dev/api/status
          python - <<'PY'
          import json
          s=json.load(open('/tmp/status.json',encoding='utf-8'))
          c=s.get('config') or {}
          a=s.get('pcAgent') or {}
          print(json.dumps({
            'running': c.get('running'),
            'scan_count': c.get('scan_count'),
            'last_scan': c.get('last_scan'),
            'universe_count': c.get('universe_count'),
            'positions': len(s.get('positions') or []),
            'candidates': len(s.get('candidates') or []),
            'pcAgent': a,
          },ensure_ascii=False,indent=2))
          assert isinstance(c,dict) and c, 'status.config missing'
          PY
      - name: Check PC agent endpoint
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/agent.json https://ki-markt-planspiel.orkimperium.workers.dev/api/agent/status
          cat /tmp/agent.json
          echo
          python - <<'PY'
          import json
          a=json.load(open('/tmp/agent.json',encoding='utf-8'))
          assert a.get('configured') is True, 'PC_AGENT_TOKEN is not configured in runtime Worker'
          print('PC_AGENT_CONFIGURED_OK')
          print('PC_AGENT_ONLINE=',a.get('online'))
          print('AGE_SECONDS=',a.get('ageSeconds'))
          print('PREFETCH_FRESH=',a.get('prefetchFresh'))
          print('RESOLVED_LEADERS=',a.get('resolvedLeaderCount'))
          print('FUTURE_CANDIDATES=',a.get('futureCandidates'))
          PY
