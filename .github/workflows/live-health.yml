name: Live Worker Health V30.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'live-health-result.json'
      - 'replay-depot-health-result.json'
      - 'validation-result.json'
      - 'recovery-20260819-result.json'

permissions:
  contents: write

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Allow Cloudflare build to publish
        run: sleep 75
      - name: Probe production
        run: |
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          curl -sS --retry 2 -o /tmp/home.html -w '%{http_code}' "$BASE/?health=$(date +%s)" > /tmp/home-code.txt || echo 000 > /tmp/home-code.txt
          curl -sS --retry 2 -o /tmp/status.json -w '%{http_code}' "$BASE/api/status?health=$(date +%s)" > /tmp/status-code.txt || echo 000 > /tmp/status-code.txt
          curl -sS --retry 2 -o /tmp/agent.json -w '%{http_code}' "$BASE/api/agent/status?health=$(date +%s)" > /tmp/agent-code.txt || echo 000 > /tmp/agent-code.txt
          curl -sS --retry 2 -o /tmp/single.js -w '%{http_code}' "$BASE/single-scanner-ui.js?health=$(date +%s)" > /tmp/single-code.txt || echo 000 > /tmp/single-code.txt
      - name: Build diagnostic
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          def text(p):
            try:return pathlib.Path(p).read_text(encoding='utf-8',errors='replace')
            except:return ''
          def obj(p):
            try:return json.loads(text(p))
            except:return {}
          def code(p):
            try:return text(p).strip().splitlines()[-1][-3:]
            except:return '000'
          def n(v,d=0.0):
            try:return float(v)
            except:return d
          s=obj('/tmp/status.json'); a=obj('/tmp/agent.json'); c=s.get('config') or {}; positions=s.get('positions') or []
          policy=s.get('selectiveCapitalPolicy') or {}; candle=s.get('candleFlowPolicy') or {}; execution=s.get('executionModel') or {}; learning=s.get('entryTimingLearning') or {}; venue=s.get('targetVenueSanity') or {}; final=s.get('finalDecisionPolicy') or {}; agm_policy=s.get('agmCalendarPolicy') or {}; agm=s.get('agmCalendar') or {}; behavior=s.get('tradingBehaviorPolicy') or {}
          system=s.get('systemValidationPolicy') or {}; feedback=s.get('daytradeLiveFeedbackPolicy') or {}; entry=s.get('daytradeEntryPolicy') or {}; dip=s.get('daytradeDipPolicy') or {}; large=s.get('daytradeLargeCapPolicy') or {}; score=s.get('canonicalScorePolicy') or {}
          market=0.0
          for p in positions:
            inv=n(p.get('invested')); ep=n(p.get('entry_price')); lp=n(p.get('last_price'),ep); ef=n(p.get('entry_fx'),1); lf=n(p.get('last_fx'),ef)
            market += inv*(lp/ep)*(lf/ef) if ep>0 and ef>0 else inv
          cash=n(c.get('cash')); equity=n(s.get('equity')); delta=equity-(cash+market)
          checks={
            'homepage':code('/tmp/home-code.txt')=='200' and 'KI-Markt' in text('/tmp/home.html'),
            'apiStatus':code('/tmp/status-code.txt')=='200' and bool(c),
            'agentEndpoint':code('/tmp/agent-code.txt')=='200',
            'scannerUiAsset':code('/tmp/single-code.txt')=='200',
            'runtimeV303':s.get('runtimeVersion')=='V30.3' and s.get('liveDecisionVersion')=='V30.3',
            'systemValidationV303':n(system.get('version'))>=30.3 and n(system.get('strategyBaseVersion'))>=30.2 and system.get('tradeRepublicHolidayCalendar') is True and system.get('stocksOnlyAccountingSmoke') is True and system.get('targetVenueSmoke') is True and system.get('freeTierSmoke') is True and system.get('mergeBlockingCriticalSmokes') is True and system.get('paperTradingOnly') is True,
            'daytradeV302Preserved':n(feedback.get('version'))>=30.2 and feedback.get('authoritativeDaytradeEntry') is True and n(feedback.get('immediateBuyMin'))==56 and n(feedback.get('maxOpenPositions'))==4 and n(feedback.get('maxSinglePositionPctOfEquity'))==25 and n(feedback.get('highChaseExtraPenalty'))==-10 and feedback.get('executedEntryBaselineRepair') is True,
            'freshTapeV301Preserved':n(entry.get('version'))>=30.1 and entry.get('authoritativeDaytradeEntry') is True and entry.get('quoteFreshnessInScore') is True and entry.get('fastFieldCoverageInScore') is True,
            'dipV300Preserved':n(dip.get('version'))>=30 and n(dip.get('maxOpenPositions'))==4,
            'largeCapV299Preserved':n(large.get('version'))>=29.9 and large.get('largeCapsPreferred') is True,
            'canonicalBuy56Preserved':n(score.get('immediateBuyMin'))==56 and n(score.get('maxOpenPositions'))==4 and n(score.get('maxSinglePositionPctOfEquity'))==25,
            'positionCountWithinDaytradeLimit':len(positions)<=4,
            'candleFlowV21':candle.get('enabled') is True and n(candle.get('version'))>=2.1,
            'selectiveCapital':policy.get('enabled') is True and policy.get('cashAllowed') is True and policy.get('alwaysInvested') is False,
            'sellerDominanceRequired':candle.get('ordinarySellerDominanceRequired') is True,
            'noForcedSizingFloor':policy.get('forcedMinimumBuyPct') is None and execution.get('forcedMinimumBuyPct') is None,
            'accountingConsistent':abs(delta)<=0.05,
            'lastErrorClear':not c.get('last_error'),
            'targetVenueSanity':venue.get('enabled') is True,
            'entryTimingLearning':learning.get('mode')=='15/30/60-minute-entry-timing-learning',
            'finalDecisionV278':n(final.get('version'))>=27.8,
            'tradingBehaviorV278':behavior.get('enabled') is True and n(behavior.get('version'))>=27.8 and final.get('heldBuyPromptSuppression') is True and final.get('heldPromptPlanOnly') is True and final.get('pullbackReclaimAware') is True and final.get('summaryMetricClarity') is True and final.get('adaptiveEntryConfirmation') is True and final.get('softSellNeedsRepeatScan') is True and final.get('timeAloneCannotCreateSell') is True and final.get('hardRiskImmediate') is True and final.get('minuteScanConfirmationSafe') is True and final.get('lateImpulseRecheck') is True and final.get('tinyProfitChurnBlocked') is True and final.get('heldFxFallbackSafe') is True,
            'aiPlanJsonRepair':final.get('aiPlanJsonRepair') is True and final.get('aiPlanCompactOutput') is True and n(final.get('aiPlanJsonRepairVersion'))>=27.7 and isinstance(behavior.get('aiPlanJsonRepair'),dict) and behavior.get('aiPlanJsonRepair',{}).get('partialObjectsNeverUsed') is True and final.get('cloudflareAiWrapperSignatureSafe') is True,
            'agmPreviewEnabled':final.get('agmPreview') is True and agm_policy.get('enabled') is True,
            'agmDailyOnlyScore':final.get('agmCalendarDailyRefresh') is True and final.get('agmLiveReevaluationEveryScan') is False and final.get('agmScoreEvaluationOnceDaily') is True and final.get('agmScoreLockedUntilNextDailyRefresh') is True and agm_policy.get('scoreEvaluationCadence')=='daily' and agm_policy.get('scoreReevaluation')=='once daily only',
            'agmCalendarPayload':isinstance(agm.get('events'),list) and agm.get('scoreEvaluationCadence')=='daily' and agm.get('scoreReevaluation')=='once daily only',
          }
          out={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runtimeVersion':s.get('runtimeVersion'),'liveDecisionVersion':s.get('liveDecisionVersion'),'http':{'home':code('/tmp/home-code.txt'),'status':code('/tmp/status-code.txt'),'agent':code('/tmp/agent-code.txt'),'scannerUi':code('/tmp/single-code.txt')},'checks':checks,'failedChecks':[k for k,v in checks.items() if not v],'allRequiredChecksPassed':all(checks.values()),'pcAgent':{'configured':a.get('configured'),'online':a.get('online'),'lastSeenAt':a.get('lastSeenAt'),'ageSeconds':a.get('ageSeconds'),'intentionallyOfflineAllowed':True},'running':c.get('running'),'scanCount':c.get('scan_count'),'lastScan':c.get('last_scan'),'lastError':c.get('last_error'),'aiLastSummary':c.get('ai_last_summary'),'cash':cash,'equity':equity,'pnl':s.get('pnl'),'marketValue':market,'accountingDelta':delta,'positions':len(positions),'positionRows':positions[:10],'recentHistory':(s.get('history') or [])[:15],'recentAiLog':(s.get('aiLog') or [])[:15],'systemValidationPolicy':system,'daytradeLiveFeedbackPolicy':feedback,'daytradeEntryPolicy':entry,'daytradeDipPolicy':dip,'daytradeLargeCapPolicy':large,'canonicalScorePolicy':score,'candleFlowPolicy':candle,'selectiveCapitalPolicy':policy,'executionModel':execution,'entryTimingLearning':learning,'risk':s.get('risk'),'finalDecisionPolicy':final,'tradingBehaviorPolicy':behavior,'agmCalendarPolicy':agm_policy,'agmCalendar':agm}
          raw=json.dumps(out,ensure_ascii=False,indent=2)+'\n';pathlib.Path('/tmp/live-health-result.json').write_text(raw,encoding='utf-8');print(raw)
          PY
      - name: Publish diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            cp /tmp/live-health-result.json live-health-result.json; git add live-health-result.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update live health result [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Enforce Worker health
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/live-health-result.json'))
          if x.get('failedChecks'): raise SystemExit('Live health failed: '+', '.join(x['failedChecks']))
          print('Worker healthy: V30.3 runtime/system validation live; V30.2 daytrade strategy preserved.')
          PY
