name: Live Worker Health

on:
  push:
    branches: [main]
    paths-ignore:
      - live-health-result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Allow Cloudflare build to publish
        run: sleep 45

      - name: Probe live Worker
        run: |
          set -euo pipefail
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          curl -fsS --retry 3 --retry-delay 2 -D /tmp/home.headers -o /tmp/home.html "$BASE/"
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/app.js "$BASE/app.js"
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/status.json "$BASE/api/status"
          curl -fsS --retry 3 --retry-delay 2 -o /tmp/agent.json "$BASE/api/agent/status"
          HOTFIX_CODE=$(curl -sS -o /tmp/ui-hotfix.css -w '%{http_code}' "$BASE/ui-hotfix.css?v=health")
          echo "$HOTFIX_CODE" >/tmp/ui-hotfix-code.txt
          grep -q 'KI Markt-Planspiel' /tmp/home.html
          grep -q 'async function load' /tmp/app.js

      - name: Build compact result
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          s=json.load(open('/tmp/status.json',encoding='utf-8'))
          a=json.load(open('/tmp/agent.json',encoding='utf-8'))
          c=s.get('config') or {}
          hotfix_code=pathlib.Path('/tmp/ui-hotfix-code.txt').read_text().strip()
          hotfix_text=pathlib.Path('/tmp/ui-hotfix.css').read_text(encoding='utf-8',errors='replace') if pathlib.Path('/tmp/ui-hotfix.css').exists() else ''
          def cand(x):
              return {k:x.get(k) for k in ['symbol','name','score','liveScore','confidence','liveConfidence','day_change','news_score','event_risk','fastScore','buyScore','sellScore','pro','contra'] if k in x}
          def hist(x):
              return {k:x.get(k) for k in ['ts','action','symbol','amount','fee','trade_pnl','reason','score'] if k in x}
          def log(x):
              return {k:x.get(k) for k in ['ts','kind','title','symbol','message','confidence'] if k in x}
          out={
            'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'homepageOk': 'KI Markt-Planspiel' in pathlib.Path('/tmp/home.html').read_text(encoding='utf-8',errors='replace'),
            'appJsOk': 'async function load' in pathlib.Path('/tmp/app.js').read_text(encoding='utf-8',errors='replace'),
            'uiHotfixHttp': hotfix_code,
            'uiHotfixLive': hotfix_code=='200' and 'Desktop layout hotfix 2026-08-18' in hotfix_text,
            'apiStatusOk': bool(c),
            'running': c.get('running'),
            'scanCount': c.get('scan_count'),
            'lastScan': c.get('last_scan'),
            'lastError': c.get('last_error'),
            'aiLastSummary': c.get('ai_last_summary'),
            'cash': c.get('cash'),
            'equity': s.get('equity'),
            'pnl': s.get('pnl'),
            'universeCount': c.get('universe_count'),
            'positions': len(s.get('positions') or []),
            'positionRows': (s.get('positions') or [])[:8],
            'candidates': len(s.get('candidates') or []),
            'topCandidates': [cand(x) for x in (s.get('candidates') or [])[:8]],
            'recentHistory': [hist(x) for x in (s.get('history') or [])[:12]],
            'recentAiLog': [log(x) for x in (s.get('aiLog') or [])[:12]],
            'sourceHealth': (s.get('sourceHealth') or [])[:20],
            'risk': s.get('risk'),
            'freeTierBudget': s.get('freeTierBudget'),
            'pcAgent': {
              'configured': a.get('configured'),
              'online': a.get('online'),
              'lastSeenAt': a.get('lastSeenAt'),
              'ageSeconds': a.get('ageSeconds'),
              'prefetchFresh': a.get('prefetchFresh'),
              'prefetchAt': a.get('prefetchAt'),
              'resolvedLeaderCount': a.get('resolvedLeaderCount'),
              'leaderHealthy': a.get('leaderHealthy'),
              'futureCandidates': a.get('futureCandidates'),
              'metrics': a.get('metrics')
            }
          }
          pathlib.Path('live-health-result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if a.get('configured') is not True:
              raise SystemExit('PC_AGENT_TOKEN missing in runtime Worker')
          PY

      - name: Publish result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-health-result.json
          if git diff --cached --quiet; then
            echo 'Health result unchanged'
          else
            git commit -m 'Update live health result [skip ci]'
            git push
          fi
