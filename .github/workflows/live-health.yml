name: Live Worker Health V31.0.2 Data Chain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'live-health-result.json'
      - 'replay-depot-health-result.json'
      - 'validation-result.json'
      - 'recovery-20260819-result.json'

permissions:
  contents: write

concurrency:
  group: live-health-v3102
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Allow Cloudflare publish
        run: sleep 75
      - name: Probe complete production data chain
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://ki-markt-planspiel.orkimperium.workers.dev',q=Date.now();
          const get=async u=>{try{const r=await fetch(u,{headers:{'cache-control':'no-cache'}});return{status:r.status,ok:r.ok,text:await r.text()}}catch(e){return{status:0,ok:false,text:String(e)}}};
          const [home,status,agent,scanner,manualUi,agmAsset]=await Promise.all([get(`${base}/?health=${q}`),get(`${base}/api/status?health=${q}`),get(`${base}/api/agent/status?health=${q}`),get(`${base}/single-scanner-ui.js?health=${q}`),get(`${base}/manual-trade-ui.js?health=${q}`),get(`${base}/agm-calendar.json?health=${q}`)]);
          let s={},a={},agm={};try{s=JSON.parse(status.text)}catch{}try{a=JSON.parse(agent.text)}catch{}try{agm=JSON.parse(agmAsset.text)}catch{}
          const positions=Array.isArray(s?.positions)?s.positions:[],c=s?.config||{},u=s?.unifiedDecisionCorePolicy||{},e=s?.expectancyCorePolicy||{},arch=s?.architecture||{},audit=Array.isArray(s?.decisionAuditRecent)?s.decisionAuditRecent:[],p=s?.profitOpportunityPolicy||{},rot=s?.relativeRotationPolicy||{},cash=s?.heldCashDeploymentPolicy||{},ch=s?.sellRebuyChurnPolicy||{},wr=s?.weakestPositionReplacementPolicy||{},m=s?.manualTradePolicy||{},ex=s?.executionModel||{},bm=m?.brokerMaster||{},ubm=u?.brokerMaster||{},capital=u?.capital||{},recovery=s?.pcAgentScanRecovery||{};
          let market=0;for(const x of positions){const inv=Number(x?.invested)||0,ep=Number(x?.entry_price)||0,lp=Number(x?.last_price)||ep,ef=Number(x?.entry_fx)||1,lf=Number(x?.last_fx)||ef;market+=ep>0&&ef>0?inv*(lp/ep)*(lf/ef):inv}
          const equity=Number(s?.equity)||0,cashEur=Number(c?.cash)||0,delta=equity-(cashEur+market);
          let chart={status:null,ok:true,symbol:null,bars:0,lastBarTs:null,error:null};
          if(positions[0]?.symbol){
            chart.symbol=String(positions[0].symbol);
            const cr=await get(`${base}/api/position-chart?symbol=${encodeURIComponent(chart.symbol)}&range=1d&health=${q}`);chart.status=cr.status;let cj={};try{cj=JSON.parse(cr.text)}catch{}
            chart.bars=Array.isArray(cj?.bars)?cj.bars.length:0;chart.lastBarTs=chart.bars?cj.bars.at(-1)?.ts||null:null;chart.error=cj?.error||null;chart.ok=cr.ok&&cj?.ok===true&&chart.bars>0;
          }
          const agmEvents=Array.isArray(agm?.events)?agm.events:[],agmUpdated=Date.parse(String(agm?.updatedAt||'')),agmAgeHours=Number.isFinite(agmUpdated)?(Date.now()-agmUpdated)/3600000:Infinity;
          const agmScoresValid=agmEvents.length>0&&agmEvents.every(x=>{const score=Number(x?.baseScore),t=Date.parse(String(x?.scoreEvaluatedAt||''));return Number.isFinite(score)&&score>=0&&score<=100&&Number.isFinite(t)});
          const checks={homepage:home.ok,apiStatus:status.ok,agentEndpoint:agent.ok,scannerUiAsset:scanner.ok,manualTradeUiAsset:manualUi.ok,agmCalendarAsset:agmAsset.ok&&agmEvents.length>0,agmCalendarFresh:Number.isFinite(agmAgeHours)&&agmAgeHours>=0&&agmAgeHours<=26&&agm?.scoreEvaluationCadence==='daily'&&agm?.scoreReevaluation==='once daily only'&&agmScoresValid,runtimeV310:s?.runtimeVersion==='V31.0'&&s?.liveDecisionVersion==='V31.0',unifiedDecisionAuthority:u.enabled===true&&u.patch==='31.0-unified-decision-authority'&&u.architecture==='single-outer-decision-authority',singleOuterLayer:Number(arch.outerDecisionLayers)===1&&arch.outerAuthority==='UnifiedDecisionCoreV310',persistentDecisionAudit:arch.persistentDecisionAudit===true&&arch.auditStorageKey==='decision-audit-v310',expectancyInsideUnified:Number(e.hardStopPct)===-1.2&&Number(e.trailArmPct)===2.4&&Number(e.minHoldMinutes)===12&&Number(e.reentryMinutes)===90&&Number(e.minPositionEur)===2200,capitalV3093:capital?.patch==='30.9.3-held-master-enrichment'&&capital?.heldMasterEnrichment===true&&Number(capital?.maxAutoAllocationPct)===100,tradeRepublicMaster:Number(bm?.rowCount)>0&&String(bm?.source||'').includes('env.ASSETS')&&Number(ubm?.rowCount)>0,manualControlV307:Number(m.version)>=30.7&&m.enabled===true&&Number(m.maxAllocationPct)===100&&ex.tradeRepublicAssetsMaster===true,sellRebuyAntiChurnV306:Number(ch.version)>=30.6&&ch.enabled===true,weakestReplacement:wr.enabled===true,profitOpportunityV305:Number(p.version)>=30.5&&p.enabled===true,relativeRotation:Number(rot.version)>=30.4,heldCashDeployment:Number(cash.maxSinglePositionPct)===100,executionUnified:ex.unifiedDecisionCoreV310===true&&ex.expectancyCoreV310===true&&Number(ex.outerDecisionLayers)===1&&Number(ex.hardPriceStopPct)===-1.2,positionChartEndpoint:chart.ok,pcAgentRecovery:recovery.enabled===true,pcAgentFresh:a?.configured!==true||(a?.online===true&&Number(a?.ageSeconds)<=180),accountingConsistent:Math.abs(delta)<=0.05,lastErrorClear:!c?.last_error,positionCountWithinLimit:positions.length<=4};
          const out={checkedAt:new Date().toISOString(),runtimeVersion:s?.runtimeVersion,liveDecisionVersion:s?.liveDecisionVersion,http:{home:String(home.status),status:String(status.status),agent:String(agent.status),scannerUi:String(scanner.status),manualUi:String(manualUi.status),agmCalendar:String(agmAsset.status),positionChart:chart.status==null?'n/a':String(chart.status)},checks,failedChecks:Object.keys(checks).filter(k=>!checks[k]),allRequiredChecksPassed:Object.values(checks).every(Boolean),agmCalendar:{updatedAt:agm?.updatedAt||null,nextRefreshAfter:agm?.nextRefreshAfter||null,ageHours:Number.isFinite(agmAgeHours)?+agmAgeHours.toFixed(2):null,events:agmEvents.length,rawUpcomingCount:Number(agm?.rawUpcomingCount)||0,matchedUpcomingCount:Number(agm?.matchedUpcomingCount)||agmEvents.length,scoreEvaluationCadence:agm?.scoreEvaluationCadence||null,scoreReevaluation:agm?.scoreReevaluation||null,scoresValid:agmScoresValid,scoreRange:agmEvents.length?[Math.min(...agmEvents.map(x=>Number(x?.baseScore)).filter(Number.isFinite)),Math.max(...agmEvents.map(x=>Number(x?.baseScore)).filter(Number.isFinite))]:[]},pcAgent:{configured:a?.configured,online:a?.online,lastSeenAt:a?.lastSeenAt,ageSeconds:a?.ageSeconds,recovery},positionChart:chart,brokerMaster:{manual:bm,unified:ubm},capitalPolicy:capital,running:c?.running,scanCount:c?.scan_count,lastScan:c?.last_scan,lastError:c?.last_error,aiLastSummary:c?.ai_last_summary,cash:cashEur,equity,pnl:s?.pnl,marketValue:market,accountingDelta:delta,positions:positions.length,positionRows:positions.slice(0,10),architecture:arch,unifiedDecisionCorePolicy:u,expectancyCorePolicy:e,decisionAuditRecent:audit.slice(0,20),manualTradePolicy:m,sellRebuyChurnPolicy:ch,weakestPositionReplacementPolicy:wr,profitOpportunityPolicy:p,relativeRotationPolicy:rot,heldCashDeploymentPolicy:cash,executionModel:ex};
          fs.writeFileSync('/tmp/live-health-result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));if(out.failedChecks.length)process.exitCode=2;
          NODE
      - name: Publish diagnostic
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=0
          for attempt in 1 2 3 4; do
            echo "Diagnostic publish attempt $attempt/4"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/live-health-result.json live-health-result.json
            git add live-health-result.json
            if git diff --cached --quiet; then
              echo 'Diagnostic already current.'
              published=1
              break
            fi
            git commit -m 'Update V31.0.2 data-chain live health [skip ci]'
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo 'Concurrent main update detected; retrying from newest origin/main.'
            sleep $((attempt * 2))
          done
          if [ "$published" != "1" ]; then
            echo 'Could not publish live-health-result.json after four race-safe attempts.' >&2
            exit 1
          fi
      - name: Enforce health
        run: |
          cp /tmp/live-health-result.json live-health-result.json
          node -e "const x=require('./live-health-result.json');if(x.failedChecks?.length){console.error(x.failedChecks);process.exit(1)}console.log('Worker healthy: V31.0 unified + TR master + position chart + PC agent + fresh daily AGM calendar live.')"
