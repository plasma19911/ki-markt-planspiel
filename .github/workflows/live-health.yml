name: Live Worker Health V29.8 Trade Republic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'live-health-result.json'
      - 'replay-depot-health-result.json'
      - 'validation-result.json'
      - 'recovery-20260819-result.json'

permissions:
  contents: write

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Allow production deploy to publish
        run: sleep 90
      - name: Probe production
        run: |
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          Q="$(date +%s)"
          curl -sS --retry 2 -o /tmp/home.html -w '%{http_code}' "$BASE/?health=$Q" > /tmp/home-code.txt || echo 000 > /tmp/home-code.txt
          curl -sS --retry 2 -o /tmp/status.json -D /tmp/status-headers.txt -w '%{http_code}' "$BASE/api/status?view=dashboard&health=$Q" > /tmp/status-code.txt || echo 000 > /tmp/status-code.txt
          curl -sS --retry 2 -o /tmp/agent.json -w '%{http_code}' "$BASE/api/agent/status?health=$Q" > /tmp/agent-code.txt || echo 000 > /tmp/agent-code.txt
          curl -sS --retry 2 -o /tmp/ui.js -w '%{http_code}' "$BASE/v287-live-ui.js?health=$Q" > /tmp/ui-code.txt || echo 000 > /tmp/ui-code.txt
          curl -sS --retry 2 -o /tmp/onepager.html -w '%{http_code}' "$BASE/onepager.html?health=$Q" > /tmp/one-code.txt || echo 000 > /tmp/one-code.txt
          curl -sS --retry 2 -o /tmp/changelog.js -w '%{http_code}' "$BASE/changelog-v297.js?health=$Q" > /tmp/changelog-code.txt || echo 000 > /tmp/changelog-code.txt
      - name: Build current diagnostic
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          def text(p):
            try:return pathlib.Path(p).read_text(encoding='utf-8',errors='replace')
            except:return ''
          def obj(p):
            try:return json.loads(text(p))
            except:return {}
          def code(p):
            try:return text(p).strip().splitlines()[-1][-3:]
            except:return '000'
          def n(v,d=0.0):
            try:return float(v)
            except:return d
          s=obj('/tmp/status.json');a=obj('/tmp/agent.json');c=s.get('config') or {};positions=s.get('positions') or []
          broker=s.get('brokerTarget') or {};session=s.get('tradeRepublicSession') or s.get('gettexSession') or {};canon=s.get('canonicalScorePolicy') or {};profit=s.get('profitExitPolicy') or {};final=s.get('finalDecisionPolicy') or {};pc=s.get('pcFirstScannerPolicy') or {};execution=s.get('executionModel') or {}
          market=0.0
          for p in positions:
            inv=n(p.get('invested'));ep=n(p.get('entry_price'));lp=n(p.get('last_price'),ep);ef=n(p.get('entry_fx'),1);lf=n(p.get('last_fx'),ef)
            market += inv*(lp/ep)*(lf/ef) if ep>0 and ef>0 else inv
          cash=n(c.get('cash'));equity=n(s.get('equity'));delta=equity-(cash+market)
          ui=text('/tmp/ui.js');one=text('/tmp/onepager.html');ch=text('/tmp/changelog.js');headers=text('/tmp/status-headers.txt').lower()
          checks={
            'homepage':code('/tmp/home-code.txt')=='200' and 'KI-Markt' in text('/tmp/home.html'),
            'apiStatus':code('/tmp/status-code.txt')=='200' and bool(c),
            'agentEndpoint':code('/tmp/agent-code.txt')=='200',
            'currentUiAsset':code('/tmp/ui-code.txt')=='200',
            'onepagerAsset':code('/tmp/one-code.txt')=='200',
            'changelogAsset':code('/tmp/changelog-code.txt')=='200',
            'accountingConsistent':abs(delta)<=0.05,
            'lastErrorClear':not c.get('last_error'),
            'tradeRepublicBroker':broker.get('name')=='Trade Republic' and broker.get('stocksOnly') is True and n(broker.get('regularOrderFeeEur'))==1 and 'Bestpreis' in str(broker.get('venue') or ''),
            'tradeRepublicSession':str(session.get('broker') or 'Trade Republic')=='Trade Republic' and str(session.get('openLocal') or '07:30')=='07:30' and str(session.get('closeLocal') or '23:00')=='23:00',
            'tradeRepublicHeader':'x-broker-target: trade-republic-bestpreis' in headers,
            'v297Runtime':n(final.get('version'))>=29.7 and n(canon.get('version'))>=29.7 and n(canon.get('immediateBuyMin'))==56 and canon.get('adaptiveProfitExit') is True and n(profit.get('version'))>=29.7,
            'v297ProfitLadder':n((profit.get('thresholds') or {}).get('minProfitPct'))==0.8 and n((profit.get('thresholds') or {}).get('profitLockPct'))==5,
            'uiTradeRepublic':'Trade Republic · Bestpreis' in ui and 'immediateBuyFrom56:true' in ui and 'softGatesAbove56:false' in ui and 'gettex' not in ui.lower(),
            'onepagerCurrent':'Trade Republic · Bestpreis' in one and 'nur Aktien' in one and 'finanzen.net ZERO' not in one and 'gettex' not in one.lower() and 'UCITS' not in one,
            'changelogV297':'V29.7' in ch and 'SOFORT BUY ab DecisionScore 56' in ch,
            'pcScannerPresent':n(pc.get('version'))>=29.2,
            'tradeRepublicFeeModel':any(str(p.get('zero_fee_model_version') or '').startswith('trade-republic-securities-') for p in positions) if positions else True,
          }
          out={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'http':{'home':code('/tmp/home-code.txt'),'status':code('/tmp/status-code.txt'),'agent':code('/tmp/agent-code.txt'),'ui':code('/tmp/ui-code.txt'),'onepager':code('/tmp/one-code.txt'),'changelog':code('/tmp/changelog-code.txt')},
            'checks':checks,'failedChecks':[k for k,v in checks.items() if not v],'allRequiredChecksPassed':all(checks.values()),
            'pcAgent':{'configured':a.get('configured'),'online':a.get('online'),'lastSeenAt':a.get('lastSeenAt'),'ageSeconds':a.get('ageSeconds')},
            'running':c.get('running'),'scanCount':c.get('scan_count'),'lastScan':c.get('last_scan'),'lastError':c.get('last_error'),'aiLastSummary':c.get('ai_last_summary'),
            'cash':cash,'equity':equity,'pnl':s.get('pnl'),'marketValue':market,'accountingDelta':delta,'positions':len(positions),'positionRows':positions[:12],
            'brokerTarget':broker,'tradeRepublicSession':session,'canonicalScorePolicy':canon,'profitExitPolicy':profit,'finalDecisionPolicy':final,'executionModel':execution,'pcFirstScannerPolicy':pc
          }
          raw=json.dumps(out,ensure_ascii=False,indent=2)+'\n';pathlib.Path('/tmp/live-health-result.json').write_text(raw,encoding='utf-8');print(raw)
          PY
      - name: Publish diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            cp /tmp/live-health-result.json live-health-result.json; git add live-health-result.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update live health result [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Enforce current production health
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/live-health-result.json'))
          if x.get('failedChecks'): raise SystemExit('Live health failed: '+', '.join(x['failedChecks']))
          print('Worker healthy: Trade Republic Bestpreis + stock-only + V29.7 decision/profit rules are live.')
          PY
