name: Apply AGM bottom UI cache patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-agm-bottom-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cache keys and changelog import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='/analysis-ui.js?v=20260820-1415'
          new='/analysis-ui.js?v=20260820-1447'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('analysis-ui cache key not found')
          p.write_text(s,encoding='utf-8')

          p=Path('public/changelog-optimization.js')
          s=p.read_text(encoding='utf-8')
          imp="import './changelog-v276-bottom.js?v=20260820-1447';\n"
          if 'changelog-v276-bottom.js' not in s:
              s=imp+s
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify placement source
        run: |
          grep -q "grid.insertAdjacentElement('afterend',box)" public/agm-calendar-ui.js
          ! grep -q "side.appendChild(box)" public/agm-calendar-ui.js
          ! grep -q "grid.prepend(box)" public/agm-calendar-ui.js
          grep -q 'analysis-ui.js?v=20260820-1447' public/index.html
          grep -q 'changelog-v276-bottom.js' public/changelog-optimization.js
      - name: Commit patch
        run: |
          if git diff --quiet -- public/index.html public/changelog-optimization.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/changelog-optimization.js
          git commit -m 'Finish AGM calendar bottom placement [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
