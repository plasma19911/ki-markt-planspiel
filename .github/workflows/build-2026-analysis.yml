name: Build 2026 Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_2026_analysis.py"
      - "scripts/build_2026_analysis_safe.py"
      - "scripts/build_2026_walkforward_causal.py"
      - "src/constants.js"
      - "src/priority-equities.js"
      - "public/universe.json"
      - ".github/workflows/build-2026-analysis.yml"
  schedule:
    - cron: "42 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-2026-analysis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install "yfinance>=1.5,<2" "pandas>=2.2,<3" "numpy>=2,<3"
      - name: Build guarded 2026 perfect hindsight and walk-forward
        run: python scripts/build_2026_analysis_safe.py
      - name: Publish latest analysis without rebase conflicts
        shell: bash
        run: |
          cp public/analysis-2026.json /tmp/analysis-2026.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/analysis-2026.json public/analysis-2026.json
          git add public/analysis-2026.json
          if git diff --cached --quiet; then
            echo "Analysis unchanged."
            exit 0
          fi
          git commit -m "chore: refresh 2026 analysis"
          git push origin main
