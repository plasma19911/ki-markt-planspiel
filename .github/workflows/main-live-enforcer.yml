name: Main always live on Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-always-live-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Regression tests
        run: npm run test:decisions
      - name: Worker dry run
        run: npm run check
      - name: Detect direct Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Direct Wrangler deploy when credentials exist
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Allow Cloudflare Git integration to publish
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify live V30.0 daytrade stack
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now();
              const sr=await fetch(`${base}/api/status?view=dashboard&main_live=${q}`,{headers:{'cache-control':'no-cache'}});const s=await sr.json();
              const cr=await fetch(`${base}/changelog-v297.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const c=await cr.text();
              const mr=await fetch(`${base}/changelog-master-v290.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const m=await mr.text();
              const final=s?.finalDecisionPolicy||{},dip=s?.daytradeDipPolicy||{},large=s?.daytradeLargeCapPolicy||{},score=s?.canonicalScorePolicy||{};
              const positions=Array.isArray(s?.positions)?s.positions:[],candidates=Array.isArray(s?.candidates)?s.candidates:[];
              const positionOrder=positions.every((p,i,a)=>i===0||Number(a[i-1]?.daytradeChanceRank||i)>=0);
              const runtimeOk=s?.runtimeVersion==='V30.0'&&s?.liveDecisionVersion==='V30.0';
              const finalOk=Number(final.version)>=30&&final.daytradeDipEntry===true&&Number(final.maxOpenPositions)===4&&Number(final.targetCashDeploymentPct)===90;
              const dipOk=Number(dip.version)>=30&&dip.enabled===true&&dip.authoritativeDaytradeEntry===true&&Number(dip.immediateBuyMin)===56&&Number(dip.maxOpenPositions)===4&&Number(dip.targetCashDeploymentPct)===90;
              const largeOk=Number(large.version)>=29.9&&large.largeCapsPreferred===true&&large.portfolioSortedBestChanceFirst===true;
              const scoreOk=Number(score.version)>=30&&score.immediateBuyMin===56&&score.betterDipScoreInput===true&&score.maxOpenPositions===4&&score.concentratedCashDeployment===true;
              const assetsOk=cr.ok&&/__CHANGELOG_V300__/.test(c)&&/V30\.0 · Bessere Dips/.test(c)&&mr.ok&&/changelogMaster='v30\.0'/.test(m)&&/version:30\.0/.test(m);
              last=`status=${sr.status} runtime=${s?.runtimeVersion} final=${final.version} dip=${dip.version} large=${large.version} score=${score.version} positions=${positions.length} candidates=${candidates.length}`;
              if(sr.ok&&runtimeOk&&finalOk&&dipOk&&largeOk&&scoreOk&&assetsOk&&positionOrder){console.log('Main live V30.0 verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Main did not become V30.0 live: '+last);
          NODE
