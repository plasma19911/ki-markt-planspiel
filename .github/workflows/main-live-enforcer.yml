name: Main always live on Cloudflare V30.4

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-always-live-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Critical V30.4 guards
        run: |
          node --check src/relative-rotation-v304.js
          node --check src/held-cash-deployment-v304.js
          node --check src/compact-portfolio-v304-relative-rotation.js
          node tests/v304-relative-rotation-cash.test.mjs
          node scripts/smoke-target-venue-guard.mjs
          node scripts/smoke-zero-accounting.mjs
      - name: Worker dry run
        run: npm run check
      - name: Detect direct Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Direct Wrangler deploy when credentials exist
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Allow Cloudflare Git integration to publish
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify live V30.4 rotation stack
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now();
              const sr=await fetch(`${base}/api/status?view=dashboard&main_live=${q}`,{headers:{'cache-control':'no-cache'}});const s=await sr.json();
              const system=s?.systemValidationPolicy||{},final=s?.finalDecisionPolicy||{},score=s?.canonicalScorePolicy||{},rotation=s?.relativeRotationPolicy||{},cash=s?.heldCashDeploymentPolicy||{},execution=s?.executionModel||{};
              const positions=Array.isArray(s?.positions)?s.positions:[];
              const runtimeOk=s?.runtimeVersion==='V30.4'&&s?.liveDecisionVersion==='V30.4';
              const systemOk=Number(system.version)>=30.3&&system.tradeRepublicHolidayCalendar===true&&system.targetVenueSmoke===true&&system.paperTradingOnly===true;
              const finalOk=Number(final.version)>=30.4&&final.relativeRotation===true&&final.legacyMigration===true&&final.heldCashTopup===true;
              const scoreOk=Number(score.version)>=30.4&&score.relativeRotation===true&&score.legacyMigration===true&&Number(score.legacyMigrationMinScoreGap)===4&&Number(score.legacyMigrationMinCandidateScore)===60&&Number(score.targetDeploymentPctWithFourHeld)===98;
              const rotationOk=Number(rotation.version)>=30.4&&Number(rotation.legacyMigrationMinScoreGap)===4&&Number(rotation.legacyMigrationCooldownMinutes)===5;
              const cashOk=String(cash.version).startsWith('30.4')&&Number(cash.targetDeploymentPct)===98&&cash.noBlindAverageDown===true;
              const executionOk=execution.relativeRotationV304===true&&execution.legacyMigrationV304===true&&execution.heldCashDeploymentV304===true&&Number(execution.maxOpenPositions)===4&&Number(execution.maxSinglePositionPctOfEquity)===25;
              last=`status=${sr.status} runtime=${s?.runtimeVersion} rotation=${rotation.version} legacyGap=${rotation.legacyMigrationMinScoreGap} cash=${cash.version} positions=${positions.length}`;
              if(sr.ok&&runtimeOk&&systemOk&&finalOk&&scoreOk&&rotationOk&&cashOk&&executionOk&&positions.length<=4){console.log('Main live V30.4 verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Main did not become V30.4 live: '+last);
          NODE
