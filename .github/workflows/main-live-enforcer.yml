name: Main always live on Cloudflare V31.7+ Unified Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-always-live-production
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Critical V31.7+ data-chain guards
        run: |
          node --check src/index.js
          node --check src/index-v18.js
          node --check src/index-v20.js
          node --check src/status-lite.js
          node --check src/outcome-learning-core-v312.js
          node --check src/unified-decision-core-v310.js
          node --check src/decision-guard.js
          node --check src/execution-cost-overlay.js
          node --check src/compact-portfolio-v310-unified.js
          node --check src/compact-portfolio-v310-agent-recovery.js
          node --check src/expectancy-core-v310.js
          node --check src/high-score-capital-deployment-v309.js
          node --check src/trade-republic-master.js
          node tests/v312-outcome-learning.test.mjs
          node tests/v310-unified-decision-core.test.mjs
          node tests/v310-expectancy.test.mjs
          node tests/status-lite-pc-agent.test.mjs
          node tests/v309-high-score-capital-deployment.test.mjs
          node tests/trade-republic-master.test.mjs
          node scripts/smoke-fast-decisions.mjs
          node scripts/smoke-best-validated-buy.mjs
          node scripts/smoke-target-venue-guard.mjs
          node scripts/smoke-zero-accounting.mjs
      - name: Worker dry run
        run: npm run check
      - name: Detect direct Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Direct Wrangler deploy when credentials exist
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Allow Cloudflare Git integration to publish
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify live current unified chain
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<42;i++){
            try{
              const r=await fetch(`${base}/api/status?main_live=${Date.now()}`,{headers:{'cache-control':'no-cache'}}),s=await r.json(),u=s?.unifiedDecisionCorePolicy||{},a=s?.architecture||{},ex=s?.executionModel||{},m=s?.manualTradePolicy||{},bm=m?.brokerMaster||{},ubm=u?.brokerMaster||{},capital=u?.capital||{},learn=s?.outcomeLearningPolicy||s?.predictiveLearningPolicy||{},positions=Array.isArray(s?.positions)?s.positions:[];
              let chartOk=true,chartText='no-position';if(positions[0]?.symbol){const symbol=String(positions[0].symbol),cr=await fetch(`${base}/api/position-chart?symbol=${encodeURIComponent(symbol)}&range=1d&main_live=${Date.now()}`,{headers:{'cache-control':'no-cache'}});let cj={};try{cj=await cr.json()}catch{}chartOk=cr.ok&&cj?.ok===true&&Array.isArray(cj?.bars)&&cj.bars.length>0;chartText=`${symbol}:${cr.status}/${cj?.bars?.length||0}`}
              const runtime=Number(String(s?.runtimeVersion||'').replace(/^V/i,'')),live=Number(String(s?.liveDecisionVersion||'').replace(/^V/i,''));
              const currentUnified=Number.isFinite(runtime)&&runtime>=31.7&&runtime===live&&u?.enabled===true&&/candidate-state-recovery/i.test(String(u?.patch||''))&&Number(a?.outerDecisionLayers)===1&&a?.outerAuthority==='UnifiedDecisionCoreV310';
              const learningContract=Number(s?.outcomeLearningVersion)===31.2&&Number(learn?.version)===31.2&&learn?.insideUnifiedAuthority===true&&a?.persistentOutcomeLearning===true&&a?.outcomeLearningStorageKey==='outcome-learning-v312'&&ex?.outcomeLearningV312===true&&ex?.continuousCandidateTracking===true&&Number.isFinite(Number(learn?.trackedSymbols));
              const brokerOk=Number(bm?.rowCount)>0&&String(bm?.source||'').includes('env.ASSETS')&&Number(ubm?.rowCount)>0;
              const ok=r.ok&&currentUnified&&learningContract&&a?.persistentDecisionAudit===true&&ex?.unifiedDecisionCoreV310===true&&ex?.tradeRepublicAssetsMaster===true&&brokerOk&&capital?.heldMasterEnrichment===true&&positions.length<=4&&chartOk;
              last=`status=${r.status} runtime=${s?.runtimeVersion}/${s?.liveDecisionVersion} learning=${learn?.mode}/${learn?.matured} tracked=${learn?.trackedSymbols} candidates=${learn?.currentCandidates} patch=${u?.patch} broker=${bm?.source}/${bm?.rowCount} chart=${chartText}`;
              if(ok){console.log('Main live V31.7+ verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Main did not become healthy current unified live: '+last);
          NODE
