name: Main always live on Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-always-live-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Regression tests
        run: npm run test:decisions
      - name: Worker dry run
        run: npm run check
      - name: Detect direct Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Direct Wrangler deploy when credentials exist
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Allow Cloudflare Git integration to publish
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify live V29.0 entry/profit + V28.8 PC-first
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';
          let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now();
              const sr=await fetch(`${base}/api/status?view=dashboard&main_live=${q}`,{headers:{'cache-control':'no-cache'}});const s=await sr.json();
              const ur=await fetch(`${base}/v287-live-ui.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const u=await ur.text();
              const cr=await fetch(`${base}/changelog-master-v290.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const c=await cr.text();
              const qr=await fetch(`${base}/quota-guard.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const qjs=await qr.text();
              const policy=s?.researchSignalFusionPolicy||{},entry=s?.entryProfitPolicy||{},profit=s?.dynamicProfitLockPolicy||{},breadth=s?.scannerBreadthPolicy||{},pc=s?.pcFirstScannerPolicy||{},final=s?.finalDecisionPolicy||{};
              const posScores=Array.isArray(policy.positionScores)?policy.positionScores:[],positions=Array.isArray(s?.positions)?s.positions:[],candidates=Array.isArray(s?.candidates)?s.candidates:[],ranking=Array.isArray(policy.ranking)?policy.ranking:[];
              const scoreShape=ranking.every(x=>Number.isFinite(Number(x?.buyScore))&&Number.isFinite(Number(x?.sellScore)));
              const e=entry?.thresholds?.entry||{};
              const v290=Number(entry.version)>=29&&entry.enabled===true&&Number(e.watchMin)===50&&Number(e.scoutMin)===53&&Number(e.microMin)===56&&Number(e.earlyMin)===58&&Number(e.regularMin)===62&&Number(profit.version)>=29&&profit.enabled===true;
              const finalOk=Number(final.version)>=29&&final.watchFrom50===true&&final.scoutEntryFrom53===true&&final.microEntryFrom56===true&&final.earlyEntryFrom58===true&&final.regularEntryFrom62===true&&final.dynamicProfitLockV290===true&&final.highScoreProfitExit===true&&final.hardRiskImmediate===true;
              const pcOk=Number(pc.version)>=28.8&&pc.enabled===true&&Number(pc.cloudflareValidationTarget)===18&&breadth.pcFirstFullMaster===true;
              const uiOk=ur.ok&&/__V287_UI_LIVE__/.test(u)&&/version:29\.0/.test(u)&&/watchFrom50:true/.test(u)&&/stagedEntryFrom53:true/.test(u)&&/microFrom56:true/.test(u)&&/earlyFrom58:true/.test(u)&&/regularFrom62:true/.test(u)&&/dynamicProfitLock:true/.test(u)&&cr.ok&&/__CHANGELOG_MASTER_V290__/.test(c)&&/currentAlwaysFirst:true/.test(c)&&qr.ok&&/v287-live-ui\.js/.test(qjs);
              const ok=sr.ok&&Number(policy.version)>=28.7&&policy.allDecisionCandidatesScored===true&&ranking.length>=candidates.length&&posScores.length>=positions.length&&scoreShape&&v290&&finalOk&&pcOk&&uiOk;
              last=`status=${sr.status} score=${policy.version} entry=${entry.version} profit=${profit.version} pc=${pc.version} master=${pc.masterUniverseCount} scanned=${pc.prescannedCount} final=${final.version} ui=${ur.status} changelog=${cr.status}`;
              if(ok){console.log('Main live verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Main did not become live: '+last);
          NODE
