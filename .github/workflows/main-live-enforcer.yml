name: Main always live on Cloudflare V30.6

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-always-live-production
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Critical V30.6 guards
        run: |
          node --check src/index.js
          node --check src/sell-rebuy-churn-v306.js
          node --check src/compact-portfolio-v306-anti-churn.js
          node --check src/profit-opportunity-v305.js
          node tests/v306-sell-rebuy-churn.test.mjs
          node tests/v3053-profit-opportunity.test.mjs
          node tests/v304-relative-rotation-cash.test.mjs
          node scripts/smoke-target-venue-guard.mjs
          node scripts/smoke-zero-accounting.mjs
      - name: Worker dry run
        run: npm run check
      - name: Detect direct Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Direct Wrangler deploy when credentials exist
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Allow Cloudflare Git integration to publish
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify live V30.6 anti-churn stack
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const r=await fetch(`${base}/api/status?main_live=${Date.now()}`,{headers:{'cache-control':'no-cache'}}),s=await r.json(),ch=s?.sellRebuyChurnPolicy||{},ex=s?.executionModel||{},positions=Array.isArray(s?.positions)?s.positions:[];
              const ok=r.ok&&s?.runtimeVersion==='V30.6'&&s?.liveDecisionVersion==='V30.6'&&Number(ch.version)>=30.6&&Number(ch.cooldownMinutes)===30&&Number(ch.absoluteCooldownMinutes)===10&&Number(ch.hardExitCooldownMinutes)===120&&ch.higherPriceRebuyGuard===true&&ex.sellRebuyAntiChurnV306===true&&positions.length<=4;
              last=`status=${r.status} runtime=${s?.runtimeVersion} cooldown=${ch.cooldownMinutes} positions=${positions.length}`;
              if(ok){console.log('Main live V30.6 verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Main did not become V30.6 live: '+last);
          NODE
