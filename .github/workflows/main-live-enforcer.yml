name: Main always live on Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-always-live-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Regression tests
        run: npm run test:decisions
      - name: Worker dry run
        run: npm run check
      - name: Detect direct Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo 'direct=true' >> "$GITHUB_OUTPUT"; else echo 'direct=false' >> "$GITHUB_OUTPUT"; fi
      - name: Direct Wrangler deploy when credentials exist
        if: steps.cf.outputs.direct == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Allow Cloudflare Git integration to publish
        if: steps.cf.outputs.direct != 'true'
        run: sleep 75
      - name: Verify live V30.2 daytrade feedback stack
        run: |
          node --input-type=module <<'NODE'
          const base='https://ki-markt-planspiel.orkimperium.workers.dev';let last='';
          for(let i=0;i<36;i++){
            try{
              const q=Date.now();
              const sr=await fetch(`${base}/api/status?view=dashboard&main_live=${q}`,{headers:{'cache-control':'no-cache'}});const s=await sr.json();
              const cr=await fetch(`${base}/changelog-v302.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const c=await cr.text();
              const mr=await fetch(`${base}/changelog-master-v290.js?main_live=${q}`,{headers:{'cache-control':'no-cache'}});const m=await mr.text();
              const final=s?.finalDecisionPolicy||{},feedback=s?.daytradeLiveFeedbackPolicy||{},entry=s?.daytradeEntryPolicy||{},dip=s?.daytradeDipPolicy||{},large=s?.daytradeLargeCapPolicy||{},score=s?.canonicalScorePolicy||{};
              const positions=Array.isArray(s?.positions)?s.positions:[];
              const runtimeOk=s?.runtimeVersion==='V30.2'&&s?.liveDecisionVersion==='V30.2';
              const finalOk=Number(final.version)>=30.2&&final.daytradeLiveFeedback===true&&final.highChaseExtraScorePenalty===true&&Number(final.maxOpenPositions)===4&&Number(final.maxSinglePositionPctOfEquity)===25&&Number(final.targetCashDeploymentPct)===90&&final.executedEntryBaselineRepair===true;
              const feedbackOk=Number(feedback.version)>=30.2&&feedback.authoritativeDaytradeEntry===true&&Number(feedback.immediateBuyMin)===56&&Number(feedback.maxOpenPositions)===4&&Number(feedback.maxSinglePositionPctOfEquity)===25&&Number(feedback.highChaseExtraPenalty)===-10&&feedback.executedEntryBaselineRepair===true;
              const entryOk=Number(entry.version)>=30.1&&entry.enabled===true&&entry.authoritativeDaytradeEntry===true&&Number(entry.immediateBuyMin)===56&&entry.quoteFreshnessInScore===true&&entry.fastFieldCoverageInScore===true;
              const dipOk=Number(dip.version)>=30&&dip.enabled===true&&Number(dip.maxOpenPositions)===4;
              const largeOk=Number(large.version)>=29.9&&large.largeCapsPreferred===true&&large.portfolioSortedBestChanceFirst===true;
              const scoreOk=Number(score.version)>=30.2&&score.immediateBuyMin===56&&score.highChaseExtraScorePenalty===true&&score.maxOpenPositions===4&&score.maxSinglePositionPctOfEquity===25&&score.executedEntryBaselineRepair===true;
              const assetsOk=cr.ok&&/__CHANGELOG_V302__/.test(c)&&/V30\.2 · Live-Trades ausgewertet/.test(c)&&mr.ok&&/changelogMaster='v30\.2'/.test(m)&&/version:30\.2/.test(m);
              last=`status=${sr.status} runtime=${s?.runtimeVersion} final=${final.version} feedback=${feedback.version} entry=${entry.version} dip=${dip.version} large=${large.version} score=${score.version} positions=${positions.length}`;
              if(sr.ok&&runtimeOk&&finalOk&&feedbackOk&&entryOk&&dipOk&&largeOk&&scoreOk&&assetsOk&&positions.length<=4){console.log('Main live V30.2 verification OK:',last);process.exit(0)}
            }catch(e){last=String(e?.message||e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          throw new Error('Main did not become V30.2 live: '+last);
          NODE
