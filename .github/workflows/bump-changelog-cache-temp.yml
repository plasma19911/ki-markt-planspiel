name: Bump changelog cache temp
on:
  push:
    branches: [fix/changelog-core-cache]
    paths: [.github/workflows/bump-changelog-cache-temp.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/changelog-core-cache
      - name: Bump changelog cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='/changelog-current-v31712.js?v=20260903-1815'
          new='/changelog-current-v31712.js?v=20260903-1830'
          if old not in s:
              raise SystemExit('old cache key not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html
          git commit -m 'Force fresh V31.7.12 changelog asset' || exit 0
          git push origin HEAD:fix/changelog-core-cache
