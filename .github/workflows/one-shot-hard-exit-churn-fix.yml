name: One-shot Hard Exit Churn Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-hard-exit-churn-fix.py'
      - 'src/hard-exit-classifier.js'
      - 'scripts/smoke-hard-exit-classifier.mjs'
      - '.github/workflows/one-shot-hard-exit-churn-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate with diagnostic capture
        id: validate
        continue-on-error: true
        run: |
          set +e
          {
            echo '=== APPLY ==='
            python3 scripts/apply-hard-exit-churn-fix.py; a=$?; echo "apply_rc=$a"
            echo '=== NPM ==='
            npm install; b=$?; echo "npm_rc=$b"
            echo '=== SYNTAX ==='
            node --check src/hard-exit-classifier.js; c1=$?
            node --check src/fresh-position-churn-guard.js; c2=$?
            node --check src/candle-flow-ai-guard.js; c3=$?
            echo "syntax_rc=$c1,$c2,$c3"
            echo '=== HARD EXIT ==='
            node scripts/smoke-hard-exit-classifier.mjs; d=$?; echo "hard_exit_rc=$d"
            echo '=== TRADE DAY ==='
            node scripts/smoke-trade-day-lessons.mjs; e=$?; echo "trade_day_rc=$e"
            echo '=== CORE ==='
            node scripts/smoke-core-trade-paths.mjs; f=$?; echo "core_rc=$f"
            echo '=== REPLAY DEPOT ==='
            node scripts/smoke-replay-depot-ui.mjs; g=$?; echo "replay_depot_rc=$g"
            echo '=== WRANGLER ==='
            npx wrangler deploy --dry-run; h=$?; echo "wrangler_rc=$h"
            rc=$((a||b||c1||c2||c3||d||e||f||g||h)); echo "overall_rc=$rc"
          } 2>&1 | tee /tmp/hard-exit-churn-diagnostic.txt
          grep -q 'overall_rc=0' /tmp/hard-exit-churn-diagnostic.txt
      - name: Publish runtime only after green checks
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fresh-position-churn-guard.js src/candle-flow-ai-guard.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Require evidence before hard momentum exits'
          git push origin HEAD:main
      - name: Publish diagnostic
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hard-exit-churn-diagnostic.txt hard-exit-churn-diagnostic.txt 2>/dev/null || echo 'diagnostic unavailable' > hard-exit-churn-diagnostic.txt
            git add hard-exit-churn-diagnostic.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update hard-exit churn diagnostic [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce validation
        if: always()
        run: grep -q 'overall_rc=0' /tmp/hard-exit-churn-diagnostic.txt
