name: V28.8 PC-first Live Health (legacy manual)

# Historical V28.8 proof only. Production is V31+, so this workflow must not
# fail every main push simply because the live runtime is newer than V28.8.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v288-live-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Legacy notice
        run: echo 'V28.8 check is historical/manual only; current production is validated by live-health.yml.'
      - name: Probe legacy PC-first assets without requiring old runtime version
        run: |
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          curl -fsS --retry 3 "$BASE/pc-agent-latest.ps1?v288=$(date +%s)" -o /tmp/agent.ps1
          curl -fsS --retry 3 "$BASE/pc-first-scanner.ps1?v288=$(date +%s)" -o /tmp/scanner.ps1
          python3 - <<'PY'
          import json,datetime,pathlib
          checks={
            'agentAssetPresent':len(pathlib.Path('/tmp/agent.ps1').read_text(errors='replace'))>100,
            'scannerAssetPresent':'PcFirstVersion' in pathlib.Path('/tmp/scanner.ps1').read_text(errors='replace'),
          }
          out={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'legacy':True,'checks':checks,'allPassed':all(checks.values()),'failed':[k for k,v in checks.items() if not v]}
          pathlib.Path('/tmp/v288-live-result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['allPassed']: raise SystemExit('Legacy V28.8 asset checks failed: '+', '.join(out['failed']))
          PY
