name: Apply AI wrapper signature fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ai-wrapper-signature-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix V27.7 wrapper run signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/trading-behavior-v277.js');s=p.read_text(encoding='utf-8')
          old="async run(input){const r=await this.inner.run(input),plan=parsePlan(r);if(!plan)return r;const state=typeof this.getState==='function'?(this.getState()||{}):{},result=enforceTradingBehaviorV277(plan,state,this.storage,typeof this.now==='function'?this.now():Date.now());this.latest=result.counters;return encode(r,result.plan)}"
          new="async run(model,input){const legacy=input===undefined&&model&&typeof model==='object',payload=legacy?model:input,r=legacy?await this.inner.run(model):await this.inner.run(model,input),plan=parsePlan(r);if(!plan)return r;const state=typeof this.getState==='function'?(this.getState()||{}):{},result=enforceTradingBehaviorV277(plan,state,this.storage,typeof this.now==='function'?this.now():Date.now());this.latest=result.counters;return encode(r,result.plan)}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('TradingBehaviorGuard run signature marker missing')
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/apply-ai-wrapper-signature-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trading-behavior-v277.js
          git commit -m 'Fix V27.7 Cloudflare AI wrapper signature [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
