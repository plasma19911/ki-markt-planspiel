name: Decision regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'public/changelog-v292.js'
      - '.github/workflows/decision-regression.yml'
  push:
    branches:
      - main
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'public/changelog-v292.js'
      - '.github/workflows/decision-regression.yml'

permissions:
  contents: read

jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run decision regression suite
        run: npm run test:decisions
