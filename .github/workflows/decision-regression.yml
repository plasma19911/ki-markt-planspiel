name: Decision regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'public/changelog-*.js'
      - 'public/index.html'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'public/changelog-*.js'
      - 'public/index.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run decision regression suite
        run: npm run test:decisions
