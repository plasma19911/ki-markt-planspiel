name: Validate Replay Depot Churn and IO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/day-replay-learning.js'
      - 'src/day-replay-runtime.js'
      - 'src/pc-day-replay-import.js'
      - 'src/compact-portfolio-v18.js'
      - 'src/index-v18.js'
      - 'src/hard-exit-classifier.js'
      - 'src/fresh-position-churn-guard.js'
      - 'src/candle-flow-ai-guard.js'
      - 'src/request-fetch-budget.js'
      - 'src/yahoo-spark-repair.js'
      - 'public/quota-guard.js'
      - 'scripts/smoke-replay-depot-ui.mjs'
      - 'scripts/smoke-hard-exit-classifier.mjs'
      - 'scripts/smoke-yahoo-null-sanity.mjs'
      - 'scripts/smoke-yahoo-request-isolation.mjs'
      - '.github/workflows/validate-replay-depot.yml'

permissions:
  contents: read

jobs:
  replay-depot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/day-replay-learning.js
          node --check src/day-replay-runtime.js
          node --check src/pc-day-replay-import.js
          node --check src/compact-portfolio-v18.js
          node --check src/index-v18.js
          node --check src/hard-exit-classifier.js
          node --check src/fresh-position-churn-guard.js
          node --check src/candle-flow-ai-guard.js
          node --check src/request-fetch-budget.js
          node --check src/yahoo-spark-repair.js
          node --check public/quota-guard.js
      - name: Replay depot churn and IO regressions
        run: |
          node scripts/smoke-replay-depot-ui.mjs
          node scripts/smoke-hard-exit-classifier.mjs
          node scripts/smoke-yahoo-null-sanity.mjs
          node scripts/smoke-yahoo-request-isolation.mjs
