name: Refresh ZERO-target Stock Universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_universe.py"
      - ".github/workflows/refresh-universe.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: zero-target-stock-universe-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main before generating
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: python -m pip install "yfinance>=1.5,<2"
      - name: Refresh ZERO-scale stock master pool
        run: python scripts/refresh_universe.py
      - name: Commit changed stock universe
        shell: bash
        run: |
          if git diff --quiet -- public/universe.json; then
            echo "Stock universe unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/universe.json
          git commit -m "chore: refresh ZERO-scale stock master pool"
          git pull --rebase origin main
          git push origin main
