name: One-shot Yahoo Request Local

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-yahoo-request-local.py'
      - 'scripts/smoke-yahoo-request-isolation.mjs'
      - 'src/request-fetch-budget.js'
      - '.github/workflows/one-shot-yahoo-request-local.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: python3 scripts/apply-yahoo-request-local.py
      - name: Validate
        run: |
          npm install
          node --check src/request-fetch-budget.js
          node --check src/yahoo-spark-repair.js
          node scripts/smoke-yahoo-null-sanity.mjs
          node scripts/smoke-yahoo-request-isolation.mjs
          node scripts/smoke-free-tier-24h.mjs
          node scripts/smoke-replay-depot-ui.mjs
          node scripts/smoke-hard-exit-classifier.mjs
          npx wrangler deploy --dry-run
      - name: Publish only after green checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/yahoo-spark-repair.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep Yahoo in-flight work request-local'
          git push origin HEAD:main
