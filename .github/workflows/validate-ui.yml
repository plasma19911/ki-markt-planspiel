name: Validate Dashboard UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/smoke-modern-ui.mjs'
      - '.github/workflows/validate-ui.yml'

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/analysis-ui.js
          node --check public/focus-ui.js
          node --check public/investment-ui.js
          node --check public/clickable-market-ui-v31712.js
      - name: Dashboard smoke test
        run: node scripts/smoke-modern-ui.mjs
