name: Patch Saudi Session Once
on:
  push:
    paths:
      - 'scripts/patch_saudi_session_once.py'
      - '.github/workflows/patch-saudi-session-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch market session and remove one-shot helpers
        run: python scripts/patch_saudi_session_once.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Support Saudi Exchange trading session"
          git push