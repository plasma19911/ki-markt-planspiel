name: Apply V27.7 changelog cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v277-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh V27.7 visible changelog cache chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('changelog-optimization.js?v=20260820-1415','changelog-optimization.js?v=20260820-1514')
          p.write_text(s,encoding='utf-8')
          p=Path('public/changelog-optimization.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("changelog-v276-bottom.js?v=20260820-1447","changelog-v276-bottom.js?v=20260820-1514")
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/apply-v277-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/changelog-optimization.js
          git commit -m 'Refresh V27.7 changelog cache [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
