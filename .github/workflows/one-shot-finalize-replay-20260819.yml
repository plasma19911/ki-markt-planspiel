name: One-shot Finalize Replay 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - 'scripts/trigger-final-replay-20260819.txt'
      - '.github/workflows/one-shot-finalize-replay-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Complete remaining replay batches
        run: |
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          : > /tmp/final-replay-batches.txt
          for i in 1 2 3; do
            echo "=== batch $i ===" | tee -a /tmp/final-replay-batches.txt
            curl -sS --retry 2 "$BASE/api/finalize-replay-20260819?key=20260819-final&run=$i-$(date +%s)" | tee -a /tmp/final-replay-batches.txt
            echo >> /tmp/final-replay-batches.txt
            sleep 3
          done
          curl -sS --retry 2 "$BASE/api/day-replay-report?final=$(date +%s)" > /tmp/final-replay-status.json
          cat /tmp/final-replay-status.json
      - name: Verify final replay
        run: |
          python3 -c "import json; x=json.load(open('/tmp/final-replay-status.json')); r=((x.get('dayReplayLearning') or {}).get('report') or {}); assert r.get('status')=='COMPLETE',r; assert int(r.get('processed') or 0)>=72,r; c=(r.get('summary') or {}).get('churn') or {}; assert int(c.get('rapidRoundTrips') or 0)>=32,c; print('Replay final:',r.get('processed'),r.get('total'),c)"
      - name: Publish proof
        run: |
          python3 -c "import json,pathlib; x=json.load(open('/tmp/final-replay-status.json')); r=((x.get('dayReplayLearning') or {}).get('report') or {}); pathlib.Path('/tmp/final-replay-20260819-result.json').write_text(json.dumps({'status':r.get('status'),'processed':r.get('processed'),'total':r.get('total'),'completedAt':r.get('completedAt'),'summary':r.get('summary')},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/final-replay-20260819-result.json final-replay-20260819-result.json
            git add final-replay-20260819-result.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record final 2026-08-19 replay [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
