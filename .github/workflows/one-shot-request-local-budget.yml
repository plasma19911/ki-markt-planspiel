name: One-shot Request Local Fetch Budget

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-request-local-fetch-budget.py'
      - 'src/request-fetch-budget.js'
      - '.github/workflows/one-shot-request-local-budget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate with diagnostic capture
        id: validate
        continue-on-error: true
        run: |
          set +e
          {
            echo '=== APPLY ==='
            python3 scripts/apply-request-local-fetch-budget.py
            a=$?
            echo "apply_rc=$a"
            echo '=== NPM ==='
            npm install
            b=$?
            echo "npm_rc=$b"
            echo '=== SYNTAX ==='
            node --check src/request-fetch-budget.js; c1=$?
            node --check src/compact-portfolio-v8.js; c2=$?
            node --check src/compact-portfolio-v9.js; c3=$?
            echo "syntax_rc=$c1,$c2,$c3"
            echo '=== FREE TIER ==='
            node scripts/smoke-free-tier-24h.mjs; d=$?
            echo "free_tier_rc=$d"
            echo '=== REPLAY DEPOT ==='
            node scripts/smoke-replay-depot-ui.mjs; e=$?
            echo "replay_depot_rc=$e"
            echo '=== WRANGLER ==='
            npx wrangler deploy --dry-run; f=$?
            echo "wrangler_rc=$f"
            rc=$(( a || b || c1 || c2 || c3 || d || e || f ))
            echo "overall_rc=$rc"
          } 2>&1 | tee /tmp/request-local-budget-diagnostic.txt
          grep -q 'overall_rc=0' /tmp/request-local-budget-diagnostic.txt
      - name: Publish runtime only after green checks
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compact-portfolio-v8.js src/compact-portfolio-v9.js scripts/smoke-free-tier-24h.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use request-local fetch budgets in V8 and V9'
          git push origin HEAD:main
      - name: Publish diagnostic
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/request-local-budget-diagnostic.txt request-local-budget-diagnostic.txt 2>/dev/null || echo 'diagnostic unavailable' > request-local-budget-diagnostic.txt
            git add request-local-budget-diagnostic.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update request-local budget diagnostic [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce validation
        if: always()
        run: |
          grep -q 'overall_rc=0' /tmp/request-local-budget-diagnostic.txt
