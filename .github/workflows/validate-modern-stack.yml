name: Validate Modern Trading Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - validation-result.json
      - live-health-result.json

permissions:
  contents: write

jobs:
  validate-modern-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply balanced deep selector
        run: python3 scripts/apply-balanced-deep-selection.py

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install > /tmp/install.log 2>&1

      - name: Run modern validation suite
        if: always()
        run: |
          set +e
          : > /tmp/results.tsv
          runcheck() {
            name="$1"; shift
            "$@" > "/tmp/${name}.log" 2>&1
            rc=$?
            printf '%s\t%s\n' "$name" "$rc" >> /tmp/results.tsv
            return 0
          }
          runcheck syntax_index node --check src/index.js
          runcheck syntax_index_v18 node --check src/index-v18.js
          runcheck syntax_constants node --check src/constants.js
          runcheck syntax_market node --check src/market-v3.js
          runcheck syntax_market_base node --check src/market-v3-base.js
          runcheck syntax_deep_selection node --check src/deep-candidate-selection.js
          runcheck syntax_r2 node --check src/r2-portfolio.js
          runcheck syntax_second_runtime node --check src/second-chance-runtime.js
          runcheck syntax_decision node --check src/decision-guard.js
          runcheck syntax_legacy node --check src/legacy-cash-neutralizer.js
          runcheck syntax_yahoo node --check src/yahoo-spark-repair.js
          runcheck syntax_profit node --check src/profit-optimizer.js
          runcheck syntax_profit_v2 node --check src/profit-optimizer-v2.js
          runcheck syntax_pullback node --check src/pullback-first-ai-guard.js
          runcheck syntax_research_entry node --check src/research-entry-quality-guard.js
          runcheck syntax_day_replay node --check src/day-replay-learning.js
          runcheck syntax_rotation_replay node --check src/rotation-replay-adjustment.js
          runcheck syntax_rotation_cost node --check src/rotation-cost-guard.js
          runcheck syntax_wide_sweep node --check src/wide-sweep-utils.js
          runcheck syntax_learning node --check src/live-signal-learning.js
          runcheck syntax_learning_reconcile node --check src/live-learning-execution-reconcile.js
          runcheck syntax_rebound node --check src/rebound-ai-guard.js
          runcheck syntax_early_breakout node --check src/early-breakout-ai-guard.js
          runcheck syntax_target_venue node --check src/target-venue-ai-guard.js
          runcheck syntax_v10 node --check src/compact-portfolio-v10.js
          runcheck syntax_v11base node --check src/compact-portfolio-v11-base.js
          runcheck syntax_v11 node --check src/compact-portfolio-v11.js
          runcheck syntax_v12 node --check src/compact-portfolio-v12.js
          runcheck syntax_v13 node --check src/compact-portfolio-v13.js
          runcheck syntax_v14 node --check src/compact-portfolio-v14.js
          runcheck syntax_v15 node --check src/compact-portfolio-v15.js
          runcheck syntax_v16 node --check src/compact-portfolio-v16.js
          runcheck syntax_v17 node --check src/compact-portfolio-v17.js
          runcheck syntax_v18 node --check src/compact-portfolio-v18.js
          runcheck syntax_v21 node --check src/compact-portfolio-v21-source-budget.js
          runcheck syntax_chart node --check public/position-chart-ui.js
          runcheck syntax_budget_ui node --check public/free-budget-ui.js
          runcheck balanced_deep_selection node scripts/smoke-balanced-deep-selection.mjs
          runcheck cash_aware node scripts/smoke-best-validated-buy.mjs
          runcheck legacy_cash node scripts/smoke-legacy-cash-neutralizer.mjs
          runcheck rebound_guard node scripts/smoke-rebound-guard.mjs
          runcheck early_breakout_guard node scripts/smoke-early-breakout-guard.mjs
          runcheck research_entry node scripts/smoke-research-entry-quality.mjs
          runcheck target_venue_guard node scripts/smoke-target-venue-guard.mjs
          runcheck entry_learning node scripts/smoke-entry-timing-learning.mjs
          runcheck learning_execution_reconcile node scripts/smoke-learning-execution-reconcile.mjs
          runcheck opportunity_cost node scripts/smoke-opportunity-cost-rotation.mjs
          runcheck second_chance node scripts/smoke-second-chance.mjs
          runcheck second_chance_watch node scripts/smoke-second-chance-watch.mjs
          runcheck capital_in_motion node scripts/smoke-capital-in-motion.mjs
          runcheck rotation_cost node scripts/smoke-rotation-cost-guard.mjs
          runcheck pc_wide_sweep node scripts/smoke-pc-wide-sweep.mjs
          runcheck yahoo_sanity node scripts/smoke-yahoo-null-sanity.mjs
          runcheck core_trade_paths node scripts/smoke-core-trade-paths.mjs
          runcheck trade_day_lessons node scripts/smoke-trade-day-lessons.mjs
          runcheck wrangler_dryrun npx wrangler deploy --dry-run

      - name: Build validation report
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os
          result={}
          tsv=pathlib.Path('/tmp/results.tsv')
          if tsv.exists():
            for line in tsv.read_text().splitlines():
              if not line.strip(): continue
              name,rc=line.split('\t',1)
              p=pathlib.Path('/tmp')/(name+'.log')
              log=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              result[name]={'ok':rc=='0','exitCode':int(rc),'tail':log[-2500:]}
          install_log=pathlib.Path('/tmp/install.log')
          install_text=install_log.read_text(encoding='utf-8',errors='replace') if install_log.exists() else ''
          install_ok=os.environ.get('INSTALL_OUTCOME','')=='success'
          failed=[k for k,v in result.items() if not v['ok']]
          out={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'commit':os.environ.get('GITHUB_SHA'),
            'install':{'ok':install_ok,'tail':install_text[-2500:]},
            'checks':result,
            'failedChecks':failed,
            'allCodeAndRegressionChecksPassed':install_ok and not failed,
            'note':'Temporary source application for the verified balanced-deep selector; revert workflow to validation-only after source commit lands.'
          }
          raw=json.dumps(out,ensure_ascii=False,indent=2)+'\n'
          pathlib.Path('/tmp/validation-result.json').write_text(raw,encoding='utf-8')
          print(raw)
          PY
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}

      - name: Publish verified selector and validation report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/apply-balanced-deep-selection.py
            cp /tmp/validation-result.json validation-result.json
            git add src/market-v3-base.js validation-result.json
            if git diff --cached --quiet; then
              echo 'Selector and validation result unchanged'
              exit 0
            fi
            git commit -m 'Balance deep scan between pullbacks and momentum [skip ci]'
            if git push origin HEAD:main; then
              echo 'Balanced deep selector published'
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Enforce syntax and regression checks
        if: always()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/validation-result.json',encoding='utf-8'))
          critical=[k for k,v in (x.get('checks') or {}).items() if not v.get('ok')]
          if not x.get('install',{}).get('ok'): critical.insert(0,'npm_install')
          if critical: raise SystemExit('Critical validation failed: '+', '.join(critical))
          print('All code/regression checks passed')
          PY
