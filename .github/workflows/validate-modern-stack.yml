name: Validate Modern Trading Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - validation-result.json
      - live-health-result.json

permissions:
  contents: write

jobs:
  validate-modern-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply adaptive AI cadence
        run: python3 scripts/apply-adaptive-ai-cadence.py
      - name: Install dependencies
        run: npm install
      - name: Validate adaptive cadence and affected stack
        run: |
          node --check src/adaptive-ai-cadence.js
          node --check src/compact-portfolio-v5.js
          node --check src/compact-portfolio-v21-source-budget.js
          node --check src/market-v3-base.js
          node scripts/smoke-adaptive-ai-cadence.mjs
          node scripts/smoke-balanced-deep-selection.mjs
          node scripts/smoke-trade-day-lessons.mjs
          node scripts/smoke-pc-wide-sweep.mjs
          node scripts/smoke-core-trade-paths.mjs
          node scripts/smoke-best-validated-buy.mjs
          node scripts/smoke-free-tier-24h.mjs
          npx wrangler deploy --dry-run
      - name: Publish adaptive cadence source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/apply-adaptive-ai-cadence.py
            git add src/compact-portfolio-v5.js
            if git diff --cached --quiet; then
              echo 'Adaptive cadence already present'
              exit 0
            fi
            git commit -m 'Use adaptive AI cadence when cash is high [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
