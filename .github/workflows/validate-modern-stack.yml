name: Validate Modern Trading Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - validation-result.json
      - live-health-result.json

permissions:
  contents: write

jobs:
  integrate-tranche-scale-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply tranche-safe execution patch
        run: python3 scripts/apply-tranche-scale-up.py
      - name: Install dependencies
        run: npm install
      - name: Validate tranche integration
        run: |
          node --check src/position-scale-up.js
          node --check src/profit-optimizer-v2.js
          node --check src/r2-portfolio.js
          node --check src/zero-accounting.js
          node scripts/smoke-position-scale-up.mjs
          node scripts/smoke-zero-accounting.mjs
          node scripts/smoke-opportunity-cost-rotation.mjs
          node scripts/smoke-capital-in-motion.mjs
          node scripts/smoke-core-trade-paths.mjs
          node scripts/smoke-best-validated-buy.mjs
          node scripts/smoke-adaptive-ai-cadence.mjs
          node scripts/smoke-balanced-deep-selection.mjs
          node scripts/smoke-trade-day-lessons.mjs
          node scripts/smoke-free-tier-24h.mjs
          npx wrangler deploy --dry-run
      - name: Publish verified R2 and ZERO tranche changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/apply-tranche-scale-up.py
            git add src/r2-portfolio.js src/zero-accounting.js
            if git diff --cached --quiet; then
              echo 'Tranche integration already present'
              exit 0
            fi
            git commit -m 'Enable tranche-safe confirmed position scale-ups [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
