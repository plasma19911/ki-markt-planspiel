name: Validate V31 Production Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - validation-result.json
      - live-health-result.json
      - replay-depot-health-result.json

permissions:
  contents: write

jobs:
  validate-production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund --ignore-scripts > /tmp/install.log 2>&1

      - name: Run V31 production validation suite
        if: always()
        run: |
          set +e
          : > /tmp/results.tsv
          runcheck() {
            name="$1"; shift
            "$@" > "/tmp/${name}.log" 2>&1
            rc=$?
            printf '%s\t%s\n' "$name" "$rc" >> /tmp/results.tsv
            return 0
          }
          runcheck syntax_index node --check src/index.js
          runcheck syntax_chart_backend node --check src/position-chart-history.js
          runcheck syntax_tr_master node --check src/trade-republic-master.js
          runcheck syntax_unified node --check src/unified-decision-core-v310.js
          runcheck syntax_unified_wrapper node --check src/compact-portfolio-v310-unified.js
          runcheck syntax_agent_recovery node --check src/compact-portfolio-v310-agent-recovery.js
          runcheck syntax_expectancy node --check src/expectancy-core-v310.js
          runcheck syntax_capital node --check src/high-score-capital-deployment-v309.js
          runcheck syntax_manual node --check src/compact-portfolio-v307-manual-control.js
          runcheck syntax_chart_ui node --check public/position-chart-ui.js
          runcheck production_decisions npm run test:decisions
          runcheck wrangler_dryrun npx wrangler deploy --dry-run

      - name: Build validation report
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime, os
          result={}
          tsv=pathlib.Path('/tmp/results.tsv')
          if tsv.exists():
            for line in tsv.read_text().splitlines():
              if not line.strip(): continue
              name,rc=line.split('\t',1)
              p=pathlib.Path('/tmp')/(name+'.log')
              log=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              result[name]={'ok':rc=='0','exitCode':int(rc),'tail':log[-2500:]}
          install_log=pathlib.Path('/tmp/install.log')
          install_text=install_log.read_text(encoding='utf-8',errors='replace') if install_log.exists() else ''
          install_ok=os.environ.get('INSTALL_OUTCOME','')=='success'
          failed=[k for k,v in result.items() if not v['ok']]
          out={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'commit':os.environ.get('GITHUB_SHA'),
            'suite':'V31 production stack',
            'install':{'ok':install_ok,'tail':install_text[-2500:]},
            'checks':result,
            'failedChecks':failed,
            'allCodeAndRegressionChecksPassed':install_ok and not failed,
            'legacySuiteEnforced':False,
            'note':'V31 production validation. Historical strategy regressions remain available via npm run test:legacy but do not gate current production.'
          }
          raw=json.dumps(out,ensure_ascii=False,indent=2)+'\n'
          pathlib.Path('/tmp/validation-result.json').write_text(raw,encoding='utf-8')
          print(raw)
          PY
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}

      - name: Publish validation report only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/validation-result.json validation-result.json
            git add validation-result.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update V31 validation result [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Enforce V31 production checks
        if: always()
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/validation-result.json',encoding='utf-8'))
          critical=[k for k,v in (x.get('checks') or {}).items() if not v.get('ok')]
          if not x.get('install',{}).get('ok'): critical.insert(0,'npm_install')
          if critical: raise SystemExit('V31 production validation failed: '+', '.join(critical))
          print('All V31 production code/regression checks passed')
          PY
