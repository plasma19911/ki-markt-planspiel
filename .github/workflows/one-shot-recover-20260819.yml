name: One-shot Recover 2026-08-19 Depot

on:
  push:
    branches: [main]
    paths:
      - 'src/recovery-20260819.js'
      - '.github/workflows/one-shot-recover-20260819.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Allow production deploy
        run: sleep 90
      - name: Restore last verified depot snapshot
        run: |
          BASE='https://ki-markt-planspiel.orkimperium.workers.dev'
          code=$(curl -sS -o /tmp/recover.json -w '%{http_code}' -X POST -H 'x-recovery-key: 20260819-health-snapshot' "$BASE/api/recover-20260819-health-snapshot")
          cat /tmp/recover.json
          test "$code" = '200'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/recover.json'))
          a=x.get('after') or {}
          assert x.get('ok') is True
          assert a.get('positions')==2
          assert abs(float(a.get('cash'))-8398.448297401768)<0.02
          assert abs(float(a.get('equity'))-9700.8849562844)<0.10
          print('Recovery verified:',a)
          PY
      - name: Publish recovery proof
        run: |
          cp /tmp/recover.json recovery-20260819-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/recover.json recovery-20260819-result.json
            git add recovery-20260819-result.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record successful depot recovery [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
