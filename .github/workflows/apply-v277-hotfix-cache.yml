name: Apply V27.7 hotfix changelog cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v277-hotfix-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh visible V27.7 hotfix chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reps={
            'public/index.html': [('changelog-optimization.js?v=20260820-1514','changelog-optimization.js?v=20260820-1532')],
            'public/changelog-optimization.js': [('changelog-v276-bottom.js?v=20260820-1514','changelog-v276-bottom.js?v=20260820-1532')],
            'public/changelog-v276-bottom.js': [('changelog-v277.js?v=20260820-1514','changelog-v277.js?v=20260820-1532')]
          }
          for fn,pairs in reps.items():
            p=Path(fn); s=p.read_text(encoding='utf-8')
            for a,b in pairs: s=s.replace(a,b)
            p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/apply-v277-hotfix-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/changelog-optimization.js public/changelog-v276-bottom.js
          git commit -m 'Refresh V27.7 hotfix changelog cache [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
